<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>CPIC Ekklesia · Christ Power International Church</title>
<meta name="description" content="Christ Power International Church (CPIC), Dubai: sermon notes, weekly programmes, events, prayer requests and testimonies.">
<meta name="theme-color" content="#1F2A7A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

</head><body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 760px), sticky header with logo and a tab row (Sermons, Events, Prayer); nothing pinned to the bottom edge */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EBEDF4; --ink:#141833; --muted:#5D6382; --line:#DCDFEA;
  --accent:#1F2A7A; --accent-ink:#FFFFFF; --accent-soft:#E4E7F6;
  --cross:#C8202A; --cross-soft:#FBE3E4;
  --ok:#0E7C53; --ok-soft:#DDF3E9; --warn:#9A5600; --warn-soft:#FBEBD3; --bad:#B42335; --bad-soft:#F8DFE2; --wa:#11804A; --wa-ink:#FFFFFF;
  --f-display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1122; --surface:#181B30; --surface-2:#22263F; --ink:#ECEEF8; --muted:#9EA3C0; --line:#2D3150;
  --accent:#8C9CFF; --accent-ink:#0F1122; --accent-soft:#232A55;
  --cross:#FF7A7F; --cross-soft:#3A1A1E;
  --ok:#4CC995; --ok-soft:#12352A; --warn:#F0B45A; --warn-soft:#3A2A12; --bad:#F27C8A; --bad-soft:#3D1A21; --wa:#35C46F; --wa-ink:#06180D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1122; --surface:#181B30; --surface-2:#22263F; --ink:#ECEEF8; --muted:#9EA3C0; --line:#2D3150;
  --accent:#8C9CFF; --accent-ink:#0F1122; --accent-soft:#232A55;
  --cross:#FF7A7F; --cross-soft:#3A1A1E;
  --ok:#4CC995; --ok-soft:#12352A; --warn:#F0B45A; --warn-soft:#3A2A12; --bad:#F27C8A; --bad-soft:#3D1A21; --wa:#35C46F; --wa-ink:#06180D;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:40px;width:auto;flex:none;background:#FFFFFF;border-radius:8px;padding:3px 6px;border:1px solid var(--line)}
.brand h1{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner b{color:var(--warn)}
.note{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--accent-soft);color:var(--ink)}

h2.view-title{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.15;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.view-sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;text-decoration:none;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:76px;resize:vertical}
textarea.tall{min-height:160px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.seg a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true],.seg a[aria-current=page]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg .count{font-size:11.5px;opacity:.85}

/* tallies */
.tallies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tallies{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tally{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.tally .n{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}
.tally .ctl{display:flex;gap:6px}
.tally .ctl button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:44px;font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.tally .ctl button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.total-bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.total-bar .big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.total-bar .meta{font-size:13.5px;opacity:.92}
.sunday-nav{display:flex;gap:8px;align-items:center}
.sunday-nav .btn{flex:none}

/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer;color:var(--ink);text-decoration:none}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.item[aria-pressed=true] .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.item[aria-pressed=true]{background:color-mix(in srgb,var(--ok-soft) 55%,var(--surface))}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.cross{background:var(--cross-soft);color:var(--cross)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.steps{display:flex;gap:4px;flex:none}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.steps i.done{background:var(--ok)} .steps i.due{background:var(--warn)}

/* date chip (sermons, events) */
.datechip{width:54px;flex:none;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:6px 0 7px;display:flex;flex-direction:column;gap:1px}
.datechip .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.datechip .d{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1}
.datechip.past{background:var(--surface-2);color:var(--muted)}

/* sermons */
.feature{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none}
.feature .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;opacity:.85}
.feature h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance}
.feature p{margin:0;opacity:.92;font-size:14.5px}
.feature .ref{font-weight:600}
.feature .go{display:inline-flex;align-self:flex-start;background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.notes{display:flex;flex-direction:column;gap:22px}
.notes-head{display:flex;flex-direction:column;gap:8px}
.notes-head h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.1;font-weight:700;text-wrap:balance;letter-spacing:-.015em}
.notes-head .meta{color:var(--muted);font-size:14px}
.notes section{display:flex;flex-direction:column;gap:10px}
.notes h3{margin:0;font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.notes p{margin:0;max-width:65ch}
.scripture{border-left:3px solid var(--cross);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.scripture .ref{font-weight:700;color:var(--cross);font-size:14px}
.scripture .txt{font-family:var(--f-display);font-size:18px;line-height:1.4}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:pt}
.points li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:pt}
.points li::before{content:counter(pt);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-display)}
.points b{display:block;font-size:15.5px}
.points span{color:var(--ink);opacity:.88}
.verses{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.verses div{padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.verses div:first-child{border-top:0}
.verses b{color:var(--accent)}
.quote{margin:0;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:18px;line-height:1.38;position:relative}
.quote::before{content:"\201C";color:var(--cross);font-size:34px;line-height:0;position:relative;top:12px;margin-right:4px}
.checklist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.qlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.memory{border-radius:var(--r);background:var(--cross-soft);padding:16px;display:flex;flex-direction:column;gap:6px}
.memory .ref{font-weight:700;color:var(--cross)}
.memory .txt{font-family:var(--f-display);font-size:18px;line-height:1.4}

/* events */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:54px 1fr;gap:14px;min-width:0}
.ev .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25}
.ev .meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ev p{margin:0;font-size:14px;white-space:pre-wrap}
.ev.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.month{display:flex;align-items:center;gap:10px;margin-top:6px}
.month span.label{white-space:nowrap}
.month::after{content:"";flex:1;height:1px;background:var(--line)}

.posterbtn{all:unset;display:block;cursor:zoom-in;border-radius:10px}
.posterbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.poster{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.weekly{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.weekly{grid-template-columns:1fr 1fr}}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wk .posterbtn.flush,.wk .posterbtn.flush .poster{border-radius:0;border:0}
.wk .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25}
.wk .meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.wk p{margin:0;font-size:14px;white-space:pre-wrap}
.days{display:flex;gap:4px}
.days span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.days span.on{background:var(--accent);color:var(--accent-ink)}
.lightbox img{width:100%;height:auto;border-radius:10px;display:block}
@media (min-width:700px){.sheet.lightbox{max-width:900px}}

/* follow us */
.socials{display:flex;flex-direction:column;gap:10px}
.social{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);min-width:0}
.social:hover{border-color:var(--accent)}
.s-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.s-ic svg{width:24px;height:24px}
.s-main{display:flex;flex-direction:column;min-width:0}
.s-name{font-family:var(--f-display);font-weight:600;font-size:16.5px}
.s-handle{font-size:13.5px;color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-what{font-size:13px;color:var(--muted)}
.s-go{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}

/* prayer */
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.req.new{border-left:4px solid var(--cross)}
.req .text{white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.req .who{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.pastor-note{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.wall{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.wall{grid-template-columns:1fr 1fr}}
.testi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.testi p{margin:0;font-size:15px;white-space:pre-wrap}
.testi .by{font-size:13px;color:var(--muted);font-weight:600}

/* follow-up */
.fu{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.fu.overdue{border-left:4px solid var(--bad)} .fu.today{border-left:4px solid var(--warn)} .fu.soon{border-left:4px solid var(--line)}
.fu-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.fu-msg{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;color:var(--ink);border:1px solid var(--line)}
.phone{font-variant-numeric:tabular-nums;user-select:all;font-weight:600}
.group-label{display:flex;align-items:center;gap:8px;margin-top:4px}
.group-label .count{font-size:12px;color:var(--muted)}

/* insights */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px;border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 25%;background-position:0 18px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.bar span.v{font-size:12px;font-weight:600;margin-bottom:3px}
.bar div{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.bar.cur div{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.bar-labels{display:flex;gap:6px;margin-top:6px}
.bar-labels span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.hbar .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:999px;display:block}
.hbar .fill.hl{background:var(--warn)}
.hbar .c{text-align:right;font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* tab row (inside the sticky header, so nothing at the bottom of the screen can cover it) */
nav.tabs{margin-top:8px}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs a{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;border-bottom:2px solid transparent;position:relative}
.tabs a svg{width:19px;height:19px;flex:none}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a .badge{background:var(--cross);color:var(--surface);border-radius:999px;font-size:10.5px;padding:0 5px;min-width:17px;text-align:center;line-height:17px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:85%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 124px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
details.tpl summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.tpl summary::-webkit-details-marker{display:none}
.ai{border:1px dashed var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.ai-status{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<script type="application/json" id="snapshot">{"sermons":[{"id":"2026-11-15-you-are-the-sent-one","application":["Ask God this week why He has placed you where you are, whether at work, at home or in your studies, and treat that place as a place of ministry.","If you are carrying a burden alone, share it with a trusted believer, pastor or friend and let God lead you to the people He will use to help.","Choose one distraction, such as gossip or a bad influence, and put it aside so that you can stay focused on your mission.","Live as an example to your family by praying, keeping good character and being faithful in small responsibilities.","Treat every person fairly, reject tribalism and favouritism, and keep learning and growing in the Word."],"createdAt":"2026-11-21T19:26:22.511Z","date":"2026-11-15","kind":"Sunday sermon","mainText":{"ref":"Genesis 45:5","text":"Now therefore be not grieved, nor angry with yourselves, that ye sold me hither: for God did send me before you to preserve life."},"memoryVerse":{"ref":"Genesis 45:5","text":"Now therefore be not grieved, nor angry with yourselves, that ye sold me hither: for God did send me before you to preserve life."},"points":[{"body":"Joseph told his brothers that it was God, not they, who sent him ahead to preserve life and save many by a great deliverance. What others meant for evil, God turned around for good. Joseph saw himself as a sent one on a mission.","title":"God sent you, and He turns evil into good"},{"body":"Using the story of a buffalo covered in parasites that found relief when fish came to eat them, the pastor showed that one person's problem can be another's meal. God will direct you to the people He will use to bring your solution. Pride and secrecy can leave you to suffer alone, so you do not need to die alone in your pain.","title":"Partner with God and with people"},{"body":"Whenever God chooses someone to deliver a family or a generation, that person will face crisis, but the grace of God is upon them. God has raised people like Moses and Esther in every generation, and you could be the one in your family. Do not give up, because your help comes from the Lord and your difficult season is temporary.","title":"Crisis comes when God calls you"},{"body":"You may lack qualifications or money, but God has put you where you are, whether at work, in marriage or in business, for a purpose. Joseph fulfilled the promise God made to Abraham, and God may fulfil promises made to your forefathers through you. Press forward, ignore those who call you names or distract you, and do not let your past control your future.","title":"Know your mission and stay focused"},{"body":"Joseph was 17 when he was taken away and 30 when he became prime minister, and the pastor said no one becomes great in a comfort zone. He shared from his own life how he stayed focused and avoided mistakes, and he told parents that their lifestyle shapes their children's destiny. Do not rely on prophecy alone but work it out with discipline, moral character and diligence.","title":"Leave the comfort zone and live as an example"},{"body":"The pastor closed with a list: know your mission, stay focused, be disciplined, be diligent, keep moral character, be faithful in small things, and use your gift to help everyone. Avoid gossip, remember your humble beginnings, reject tribalism because we are one in Christ, and keep learning and growing. He ended by praying that as good trees we would bear good fruit.","title":"Character that carries the calling"}],"prayer":"Father, thank You that You are with us in every season and that You turn what others mean for evil into good. Help us to know the mission You have given us, to stay focused and disciplined, and to seek help from You and from others without pride. Keep us from gossip and division, and make us good trees that bear good fruit in our homes, our workplaces and our church. We pray in Jesus' name. Amen.","preacher":"Pastor James","questions":["Joseph said in Genesis 45:5-8 that God sent him ahead of his brothers. How did Joseph's view of his suffering change how he treated his brothers, and what can we learn from it?","The pastor said that someone's problem can be someone else's meal and that we should partner with God and with people. Why do you think pride keeps people from asking for help, and how can we be more open with one another?","The pastor said that when God calls you, you should expect crisis. Which Bible characters, such as Moses or Esther, faced difficulty because of their calling, and what encouraged them?","Genesis 15 shows God's promise to Abraham being fulfilled through Joseph. How might God be working in your family across generations, and what is your part in it?","The pastor spoke about focus, discipline, character and rejecting tribalism and gossip. Which of these do you find hardest, and what step can you take this week to grow in it?"],"quotes":["You are the sent one. You have been sent. You are on a mission.","It was somebody's problem, but somebody's meal.","You don't need to die alone in your pain.","You must partner with God and with men.","You can never be great in your comfort zone.","Don't let anybody divert your attention. You are a man, a woman on a mission."],"scriptures":[{"note":"The main text, in which Joseph tells his brothers that God sent him to preserve life and save many by a great deliverance.","ref":"Genesis 45:5-8"},{"note":"Cited to show that all things work together for good to those who love God.","ref":"Romans 8:28"},{"note":"Quoted to say that many are the afflictions of the righteous but the Lord delivers from them all.","ref":"Psalm 34:19"},{"note":"Used to remind us that we will have tribulation in this world but should be of good cheer because Christ has overcome.","ref":"John 16:33"},{"note":"Quoted to encourage believers that their help comes from the Lord.","ref":"Psalm 121:1-2"},{"note":"Used to urge believers to forget what is behind and press forward.","ref":"Philippians 3:13-14"},{"note":"God's promise to Abraham about his descendants, which God used Joseph to fulfil.","ref":"Genesis 15:13-14"},{"note":"The pastor referred to Esther, whom God raised up to deliver her people when Haman planned to destroy the Jews.","ref":"Esther 4:14"},{"note":"Used to say we are placed in our workplaces to let our light shine before men.","ref":"Matthew 5:16"},{"note":"Cited to show that in Christ there is no Jew or Gentile, so there is no place for tribalism.","ref":"Galatians 3:28"},{"note":"The pastor prayed that as a good tree he would never bear bad fruit.","ref":"Matthew 7:17"}],"series":"","summary":"Preaching from Genesis 45:5-8, Pastor James showed that Joseph saw himself as someone God had sent ahead to preserve life, even though his brothers had meant their actions for evil. He taught that God turned the pain into purpose and that every believer is on a mission wherever God has placed them. Using the picture of a buffalo delivered by fish, he urged believers to partner with God and with people instead of suffering alone in pride. He closed by calling the church to stay focused, disciplined and of good character, and to bear good fruit.","title":"You Are the Sent One","updatedAt":"2026-11-21T19:26:22.511Z","youtubeUrl":"https://www.youtube.com/watch?v=ffr2NSEXGP4&t=5926s"},{"application":["Write down what you are pursuing in the next five years and the first step you can take this week.","Take one practical step to improve yourself, such as enrolling in a course, learning a skill or asking to take on more at work.","Pray about the voices around you, and step back from people or habits that distract you from your goals.","Replace complaining with offering solutions at home, at work and at church.","Take time to pray and fast this week, and join the Tuesday Bible study or Morning Glory to be sharpened and inspired."],"createdAt":"2026-11-11T04:21:08.544Z","date":"2026-11-08","kind":"Sunday sermon","mainText":{"ref":"2 Kings 2:9","text":"And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me."},"memoryVerse":{"ref":"2 Kings 2:9","text":"And Elisha said, I pray thee, let a double portion of thy spirit be upon me."},"points":[{"body":"Elisha knew exactly what he wanted and would not leave Elijah, even when told three times to stay behind. Pastor James urged listeners to decide what they are pursuing, because where you are now is not where you should remain. He said people should not meet you in five years where they left you.","title":"Know what you are looking for"},{"body":"The sons of the prophets, fellow believers, kept reminding Elisha that his master would be taken, and Elisha told them to keep silent. Pastor James taught that even close friends and fellow believers can discourage you, and that someone who knows what he seeks is not afraid of any voice. He also urged distancing yourself from people who are not going anywhere.","title":"Silence discouraging voices"},{"body":"Pastor James told the young to use the tools and opportunities they have today, with no excuses for failing. He urged them to improve their skills, go back to school, stop complaining and be a solution. He encouraged those in humble jobs to treat them as a stepping stone and not a tombstone, and to aim higher, from grade one to grade ten.","title":"Develop yourself and refuse to be mediocre"},{"body":"Elisha asked for a double portion, which Elijah called a hard thing, and Elisha stayed focused until he saw Elijah taken up. Pastor James taught that focus, determination and refusing distraction separate great people from the rest. He also taught that faith is a currency in the realm of the spirit, and that he held on through the early days of the ministry when only five people were present.","title":"Ask boldly, stay focused and do not be distracted"},{"body":"Elisha took up the fallen mantle, struck the water and it divided. Pastor James said there is no harm in trying, that failure is part of success, and that you do not need to be Elijah for God to work through you. He also said we need inspiration, and that we should walk with great people and be willing to sacrifice for what we want to become.","title":"Take up the mantle and try, even if you fail"},{"body":"Pastor James encouraged those from poor or struggling backgrounds not to settle for less. He urged them to be the one who brings the change, and prayed that God would break patterns of poverty in their families. He said that those who doubted or mocked will see what God has done.","title":"Break the pattern in your family"}],"prayer":"Lord God, thank you for the example of Elisha. Give us clear vision for what you have called us to, and the determination to pursue it. Help us to silence the voices of discouragement and to refuse distraction. Teach us to grow in skill, character and faith, and to take up the mantle you have placed before us. Break every pattern of lack in our families, and use our lives to inspire others and bring glory to your name. In Jesus' name we pray, Amen.","preacher":"Pastor James","questions":["Why do you think Elijah told Elisha to stay behind three times, and what does Elisha's response teach us about commitment?","Who are the voices around you that discourage you, and how can you respond with wisdom while remaining kind?","Elisha asked for a double portion. What are you asking God for, and what are you doing to walk it out?","Pastor James said that failure is part of success. How have you seen this in your own life or in Scripture?","How can we use our current job or situation as a stepping stone, while still being faithful where God has placed us?"],"quotes":["Where you are now is not where you should be.","A man that is looking for something is not afraid of any voice.","Your thinking now determines where you go, and the group around you determines where you go.","Let that cleaning job be a stepping stone for you, not a tombstone.","Failure is part of success.","What separates great men from the rest is their determination.","Don't be a troublemaker. Be a solution."],"scriptures":[{"note":"Elisha refuses to leave Elijah and the sons of the prophets try to discourage him.","ref":"2 Kings 2:1-4"},{"note":"Elijah strikes the water with his mantle and the river divides.","ref":"2 Kings 2:8"},{"note":"Elisha asks for a double portion and Elijah says it is a hard thing.","ref":"2 Kings 2:9-10"},{"note":"Elijah is taken up, Elisha sees it and takes up the fallen mantle.","ref":"2 Kings 2:11-13"},{"note":"Elisha strikes the water with the mantle and it divides, showing he could do the same.","ref":"2 Kings 2:14"},{"note":"Quoted as it is of God who shows mercy, as the one whose mercy he rides on.","ref":"Romans 9:16"},{"note":"Walk out your salvation with fear and trembling, meaning it must be worked out, not only spoken.","ref":"Philippians 2:12"},{"note":"Referred to as iron sharpening iron, as a reason to come to church and be inspired.","ref":"Proverbs 27:17"}],"series":"","summary":"Pastor James preached from 2 Kings 2 on Elisha's determined pursuit of Elijah's mantle. Elisha refused to be turned back by Elijah's testing, by discouraging voices of the sons of the prophets, or by distraction, because he knew what he was looking for. Pastor James challenged church members, especially the young, to set clear goals, improve themselves, stay focused, refuse mediocrity and trust God to help them rise. He closed with prayer, the Lord's Table and church announcements.","title":"Know What You're Looking For: Pursuing Your Double Portion","updatedAt":"2026-11-11T04:21:08.544Z","youtubeUrl":"https://www.youtube.com/watch?v=Bc623JFIa8g","id":"2026-11-08-know-what-you-re-looking-for-pursuing-yo"}],"events":[{"category":"Fellowship","contactName":"","contactPhone":"","days":[],"description":"Celebrating our /* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

function normPhone(raw){
  const s = String(raw||"").trim(); if(!s) return "";
  let d = s.replace(/\D/g,""); if(!d) return "";
  if(s.startsWith("+")) return "+"+d;
  if(d.startsWith("00")) return "+"+d.slice(2);
  if(d.startsWith("971")) return "+"+d;
  d = d.replace(/^0+/,""); return "+971"+d;
}
function prettyPhone(p){ if(!p) return ""; if(p.startsWith("+971") && p.length===13) return "+971 "+p.slice(4,6)+" "+p.slice(6,9)+" "+p.slice(9); return p; }

}

function captureUI(){
  const app=$("app"); const vals=[];
  app.querySelectorAll("input,select,textarea").forEach(el=>{
    if(!el.id || el.type==="search") return;
    vals.push({id:el.id, k: el.form ? (el.form.dataset.k||"") : "", v: el.type==="checkbox" ? el.checked : el.value});
  });
  const a=document.activeElement;
  const foc = a && a.id && app.contains(a) ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  return {vals, foc};
}
function restoreUI(ui){
  for(const x of ui.vals){
    const el=$(x.id); if(!el) continue;
    if((el.form ? (el.form.dataset.k||"") : "") !== x.k) continue;
    if(x.id==="myNotes") continue;
    if(el.type==="checkbox") el.checked=x.v; else el.value=x.v;
  }
  if(ui.foc){ const el=$(ui.foc.id); if(el){ try{ el.focus({preventScroll:true}); if(ui.foc.s!=null) el.setSelectionRange(ui.foc.s, ui.foc.e); }catch(_){} } }
}

function readSermonForm(){
  const blocks = String($("sPoints").value||"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{ const L=b.split("\n").map(x=>x.trim()).filter(Boolean); return {title:L[0].replace(/^\s*(?:\d+[.)]|[-•*])\s*/,""), body:L.slice(1).join(" ")}; });
  const verses = lines($("sVerses").value).map(l=>{ const m=l.split(/\s[—–-]\s|\s\|\s/); return {ref:m[0].trim(), note:m.slice(1).join(" — ").trim()}; });
  return {
    date:$("sDate").value||lastSunday(today()), kind:$("sKind").value, preacher:$("sPreacher").value.trim(), youtubeUrl:$("sYoutube").value.trim(),
    title:$("sTitle").value.trim(), series:$("sSeries").value.trim(), summary:$("sSummary").value.trim(),
    mainText:{ref:$("sMainRef").value.trim(), text:$("sMainTxt").value.trim()},
    points:blocks, scriptures:verses, quotes:lines($("sQuotes").value), application:lines($("sApply").value), questions:lines($("sQuestions").value),
    memoryVerse:{ref:$("sMemRef").value.trim(), text:$("sMemTxt").value.trim()}, prayer:$("sPrayer").value.trim()
  };
}
function fillSermonForm(d){
  const set=(id,v)=>{ const el=$(id); if(el && v!=null && String(v).trim()!=="") el.value=v; };
  set("sTitle",d.title); set("sSeries",d.series); set("sSummary",d.summary);
  if(d.mainText){ set("sMainRef",d.mainText.ref); set("sMainTxt",d.mainText.text); }
  if(Array.isArray(d.points)) set("sPoints", d.points.map(p=>String(p.title||"")+(p.body?"\n"+p.body:"")).join("\n\n"));
  if(Array.isArray(d.scriptures)) set("sVerses", d.scriptures.map(v=>String(v.ref||"")+(v.note?" — "+v.note:"")).join("\n"));
  if(Array.isArray(d.quotes)) set("sQuotes", d.quotes.map(String).join("\n"));
  if(Array.isArray(d.application)) set("sApply", d.application.map(String).join("\n"));
  if(Array.isArray(d.questions)) set("sQuestions", d.questions.map(String).join("\n"));
  if(d.memoryVerse){ set("sMemRef",d.memoryVerse.ref); set("sMemTxt",d.memoryVerse.text); }
  set("sPrayer",d.prayer);
}
async function runAI(){
  const tr = ($("sTranscript").value||"").trim();
  if(tr.length<200){ toast("Paste the full transcript first"); return; }
  let sample=null; try{ sample = await claude.use("sample"); }catch(_){}
  if(!sample){ S.aiMsg="Claude is not available in this view. Fill in the notes by hand."; render(); return; }
  const meta = `Date: ${$("sDate").value||""}. Type: ${$("sKind").value}. Preacher: ${$("sPreacher").value||"not given"}.`;
  const prompt = `You are helping Christ Power International Church (CPIC), a church in Dubai, publish notes on a sermon for church members.

Rules:
- Use only what the preacher actually taught in the transcript below. Do not add teaching that is not there.
- The transcript may come from auto-captions with mistakes. Correct obvious mis-hearings of Bible books, names and words.
- "quotes" are 3 to 6 short, memorable sentences the preacher actually said, kept close to the original wording with filler words removed.
- Bible references are written like "Romans 8:28". For "mainText.text" and "memoryVerse.text" use the King James Version wording.
- "points" are the sermon's main points in the order preached (usually 3 to 6).
- "questions" are 5 Bible study discussion questions for small groups based on this message.
- "application" is 3 to 5 practical things to do this week.
- Write in warm, clear English for church members.

Reply with only JSON in exactly this shape:
{"title":"","series":"","summary":"3 to 4 sentences","mainText":{"ref":"","text":""},"points":[{"title":"","body":"2 to 3 sentences"}],"scriptures":[{"ref":"","note":"one line on how it was used"}],"quotes":[""],"application":[""],"questions":[""],"memoryVerse":{"ref":"","text":""},"prayer":"a short closing prayer based on the message"}
Use "" for series if none was mentioned.

${meta}

Transcript:
"""
${tr.slice(0,150000)}
"""`;
  S.aiBusy=true; S.aiMsg="Claude is reading the sermon. This can take up to a minute."; S.aiCtl=new AbortController(); render();
  try{
    const d = await sample.json(prompt, {signal:S.aiCtl.signal, onText:()=>{ if(S.aiMsg.startsWith("Claude is reading")){ S.aiMsg="Writing the notes…"; const st=$("aiStatus"); if(st) st.textContent=S.aiMsg; } }});
    S.aiBusy=false; S.aiMsg="Done. Check each section below, then publish."; render();
    if(d && typeof d==="object") fillSermonForm(d);
    const t=$("sTitle"); t && t.scrollIntoView({block:"center",behavior:"smooth"});
  }catch(e){
    S.aiBusy=false;
    const c=e&&e.code;

const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const RR = ["SU","MO","TU","WE","TH","FR","SA"];
const posterSrc = id => (SNAP.posters && SNAP.posters[id]) || "/_blob/"+id;
function daysLabel(days){
  const d=(days||[]).slice().sort((a,b)=>a-b);
  if(!d.length) return "";
  if(d.length===7) return "Every day";
  let run=d.length>=3; for(let i=1;i<d.length;i++) if(d[i]!==d[i-1]+1) run=false;
  if(run) return "Every "+DAY_NAMES[d[0]]+" – "+DAY_NAMES[d[d.length-1]];
  return "Every "+d.map(x=>DAY_NAMES[x]).join(", ").replace(/, ([^,]*)$/," and $1");
}
function nextOccurrence(ev){
  const d=ev.days||[]; if(!d.length) return today();
  for(let i=0;i<7;i++){ const s=addDays(today(),i); if(d.includes(parse(s).getDay())) return s; }
  return today();
}
function gcalLink(ev){
  const d = s => String(s||"").replace(/-/g,"");
  const t = s => String(s||"").replace(":","")+"00";
  const start = ev.recurring ? nextOccurrence(ev) : ev.startDate;
  let dates;
  if(ev.startTime){ const endD = ev.recurring ? start : (ev.endDate||ev.startDate); const endT = ev.endTime || ev.startTime; dates = d(start)+"T"+t(ev.startTime)+"/"+d(endD)+"T"+t(endT); }
  else { dates = d(start)+"/"+d(addDays(ev.recurring?start:(ev.endDate||ev.startDate),1)); }
  const q = {action:"TEMPLATE", text:ev.title||"CPIC event", dates, ctz:"Asia/Dubai", location:ev.venue||"", details:(ev.description||"")+(ev.link?"\n\n"+ev.link:"")+"\n\nChrist Power International Church"};
  if(ev.recurring && (ev.days||[]).length) q.recur = "RRULE:FREQ=WEEKLY;BYDAY="+ev.days.map(x=>RR[x]).join(",");
  return "https://calendar.google.com/calendar/render?"+new URLSearchParams(q).toString();
}
const mapLink = ev => ev.mapLink || ("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((ev.venue||"")+" Dubai"));
function evWhen(ev){
  const tpart = ev.startTime ? fmtTime(ev.startTime)+(ev.endTime?" – "+fmtTime(ev.endTime):"") : "";
  if(ev.recurring) return [daysLabel(ev.days), tpart].filter(Boolean).join(" · ");
  const multi = ev.endDate && ev.endDate!==ev.startDate;
  const dpart = multi ? `${fmtY(ev.startDate)} – ${fmtY(ev.endDate)}` : fmtLong(ev.startDate);
  return [dpart,tpart].filter(Boolean).join(" · ");
}
function posterImg(ev, cls){
  if(!ev.posterId) return "";

}
function evShare(ev){ return `*${ev.title}*\n${evWhen(ev)}${ev.venue?"\n"+ev.venue:""}${ev.description?"\n\n"+ev.description:""}${ev.link?"\n"+ev.link:""}\n\nChrist Power International Church`; }

function evCard(ev, isNext){
  const past = (ev.endDate||ev.startDate) < today();
  const days = daysBetween(today(), ev.startDate);
  const when = days===0?"Today":days===1?"Tomorrow":days>1?`In ${days} days`:"";
  return `<article class="ev ${isNext?"next":""}">${dateChip(ev.startDate,past)}
    <div class="body">
      ${posterImg(ev)}
      <div class="pills" style="margin:0">${isNext?`<span class="pill cross">Next up</span>`:""}${when&&!past?`<span class="pill acc">${esc(when)}</span>`:""}<span class="pill">${esc(ev.category||"Event")}</span></div>
      <h4>${esc(ev.title)}</h4>
      <div class="meta"><span>${esc(evWhen(ev))}</span>${ev.venue?`<span>${esc(ev.venue)}</span>`:""}${ev.contactName||ev.contactPhone?`<span>${esc(ev.contactName||"Contact")}: ${ev.contactPhone?`<span class="phone">${esc(prettyPhone(ev.contactPhone))}</span>`:""}</span>`:""}</div>
      ${ev.description?`<p>${esc(ev.description)}</p>`:""}

    </div></article>`;
}
function wkCard(ev){

  return `<article class="wk">${posterImg(ev,"flush")}

}

  else if(f==="prayed") list = items.filter(i=>i.status==="prayed");
  else if(f==="testimony") list = items.filter(i=>i.kind==="testimony");
  const wa = (S.church||{}).whatsapp||"";
  return `
  <div class="kpis">
    <div class="kpi"><span class="label">Waiting</span><span class="v num">${counts.new}</span><span class="d">Not yet prayed for</span></div>
    <div class="kpi"><span class="label">This month</span><span class="v num">${items.filter(i=>String(i.createdAt||"").startsWith(month)).length}</span><span class="d">Requests and testimonies</span></div>
    <div class="kpi"><span class="label">Prayed for</span><span class="v num">${counts.prayed}</span><span class="d">All time</span></div>
    <div class="kpi"><span class="label">Want a call</span><span class="v num">${items.filter(i=>i.callback&&(i.status||"new")==="new").length}</span><span class="d">Still waiting</span></div>
  </div>
  <div class="seg" role="group" aria-label="Inbox filter">${[["new","Waiting"],["prayed","Prayed for"],["testimony","Testimonies"],["all","All"]].map(([k,l])=>`<button data-inf="${k}" aria-pressed="${f===k}">${l} <span class="count num">${counts[k]}</span></button>`).join("")}</div>
  ${S.db&&!S.loaded.prayers?`<div class="empty">Loading…</div>`: list.length?`<div style="display:flex;flex-direction:column;gap:10px">${list.map(i=>{
    const key = i.owner+"|"+i.id; const isNew=(i.status||"new")==="new";
    const isT = i.kind==="testimony";
    return `<article class="req ${isNew?"new":""}">
      <div class="who"><div><b>${esc(i.name||"Someone")}</b> <span class="small muted">· ${esc(fmtY((i.createdAt||"").slice(0,10)))}</span>
        <div class="pills">${isT?`<span class="pill cross">Testimony</span>`:`<span class="pill">${esc(i.category||"Prayer")}</span>`}${i.callback?`<span class="pill warn">Wants a call</span>`:""}${isT&&i.share?`<span class="pill">OK to share${i.showName?" with name":" without name"}</span>`:""}${i.status==="prayed"?`<span class="pill ok">Prayed${i.prayedAt?" "+esc(fmt(i.prayedAt)):""}</span>`:i.status==="shared"?`<span class="pill ok">On the wall</span>`:""}</div></div>
        ${i.phone?`<span class="phone small">${esc(prettyPhone(i.phone))}</span>`:""}</div>
      <div class="text">${esc(i.text)}</div>
      ${i.pastorNote?`<div class="pastor-note"><b>Your note:</b> ${esc(i.pastorNote)}</div>`:""}
      ${isNew&&!isT?`<div class="field"><label for="note_${esc(i.id)}" class="small">Note back to them (optional)</label><input type="text" id="note_${esc(i.id)}" placeholder="e.g. We are standing with you in prayer"></div>`:""}
      <div class="row">
        ${!isT&&isNew?`<button class="btn sm primary" data-prayed="${esc(key)}">Mark as prayed</button>`:""}
        ${isT&&i.share&&i.status!=="shared"?`<button class="btn sm primary" data-wall="${esc(key)}">Share on the wall</button>`:""}
        ${isT&&isNew?`<button class="btn sm" data-tread="${esc(key)}">Mark as read</button>`:""}
        ${i.phone?`<a class="btn sm wa" href="${esc(waLink(i.phone,"Hi "+firstName(i.name)+", this is "+"your pastor"+" from CPIC. "))}" target="_blank" rel="noopener">${WA_ICON}WhatsApp</a>`:""}
      </div>
    </article>`;}).join("")}</div>`:`<div class="list"><div class="empty"><b>${f==="new"?"No requests waiting":"Nothing here yet"}</b>${f==="new"?"Every request has been prayed for.":"Requests from members appear here."}</div></div>`}
  <section class="section">
    <h3>Prayer line on WhatsApp</h3>
    <form id="churchForm" class="row" autocomplete="off" style="align-items:flex-end">
      <div class="field" style="flex:1;min-width:200px"><label for="churchWa">Church WhatsApp number</label><input type="tel" id="churchWa" value="${esc(wa)}" placeholder="+971 50 123 4567"><span class="hint">Anyone who can’t save requests in the app sends them to this number instead. Use the pastors’ prayer line.</span></div>
      <button class="btn" type="submit">Save</button>
    </form>
  </section>`;
}

function renderSheet(){
  const root=$("sheetRoot");
  if(!S.posterView){ root.innerHTML=""; return; }
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet lightbox" role="dialog" aria-modal="true" aria-label="Poster">
    <div class="section-head"><span class="label">Poster</span><button class="btn ghost" id="closePoster" aria-label="Close">✕</button></div>
    <img src="${esc(posterSrc(S.posterView))}" alt="Event poster"></div></div>`;
  setTimeout(()=>{ const c=$("closePoster"); c&&c.focus(); },0);
}
document.addEventListener("error", e=>{ const el=e.target; if(el && el.classList && el.classList.contains("poster")){ const b=el.closest(".posterbtn"); if(b) b.hidden=true; else el.hidden=true; } }, true);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.posterView){ S.posterView=null; renderSheet(); } });

/* ---------- writes ---------- */
function guard(){ if(!S.db){ toast("Not connected. Sign in to Claude to save."); return false; } if(!S.isTeam){ toast("Only the church leaders can change this."); return false; } return true; }
function writeErr(e){
  const c = e && e.code;
  if(c==="invalid_argument") toast("Your access level does not allow this change.");
  else if(c==="quota_exceeded") toast("Storage is full. Export and remove old records first.");
  else toast("Could not save. Check your connection and try again.");
}
async function retry(fn){ try{ return await fn(); }catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*900)); return fn(); } throw e; } }
async function saveSermon(){
  if(!guard()) return;
  const d = readSermonForm();
  if(!d.title){ toast("Add the sermon title first"); return; }
  const id = S.sermonEdit.id || (d.date+"-"+(slug(d.title)||uid8()));
  const body = {...d, updatedAt:new Date().toISOString()};
  if(!S.sermonEdit.id) body.createdAt = body.updatedAt;
  else { const old=S.sermons.find(x=>x.id===id); if(old&&old.createdAt) body.createdAt=old.createdAt; }
  try{ await retry(()=>S.db.collection("sermons").doc(id).set(body)); S.sermonEdit=null; S.aiMsg=""; toast("Sermon notes published"); location.hash="sermon-"+id; }
  catch(e){ writeErr(e); }
}
function readEventDraft(){
  const g=id=>{ const el=$(id); return el?el.value:""; };
  const rec = $("eRepeat").checked;
  const days = rec ? [0,1,2,3,4,5,6].filter(d=>{ const el=$("eDay"+d); return el ? el.checked : (S.evEdit.draft.days||[]).includes(d); }) : [];
  return {...S.evEdit.draft, title:g("eTitle").trim(), category:g("eCat"), venue:g("eVenue").trim(), recurring:rec, days,
    startDate: rec?"":g("eStart"), endDate: rec?"":g("eEnd"), startTime:g("eT1"), endTime:g("eT2"),
    contactName:g("eCName").trim(), contactPhone:normPhone(g("eCPhone")), link:g("eLink").trim(), mapLink:g("eMap").trim(), online:$("eOnline").checked, description:g("eDesc").trim()};
}
async function saveEvent(){
  if(!guard()) return;
  const d = readEventDraft();
  if(!d.title){ toast("Add the event name"); return; }
  if(d.recurring && !d.days.length){ toast("Pick the days it happens on"); return; }
  if(!d.recurring && !d.startDate){ toast("Add the start date"); return; }
  if(d.endDate && d.endDate<d.startDate) d.endDate="";
  const body = {...d, updatedAt:new Date().toISOString()}; delete body.id;
  const ref = S.evEdit.id ? S.db.collection("events").doc(S.evEdit.id) : S.db.collection("events").doc();
  try{ await retry(()=>ref.set(body)); toast(S.evEdit.id?"Event updated":"Event added"); S.evEdit=null; render(); }
  catch(e){ writeErr(e); }
}
async function uploadPoster(file){
  const st=$("posterState");
  if(!file) return; if(!S.assets){ toast("Only editors can upload posters"); return; }
  if(file.size>20*1024*1024){ toast("That image is too large. Use one under 20 MB."); return; }
  S.evEdit.draft = readEventDraft();
  if(st) st.textContent="Uploading…";
  try{ const r = await S.assets.upload(file); S.evEdit.draft.posterId = r.id; render(); toast("Poster added. Save the event to keep it."); }
  catch(e){ const s2=$("posterState"); if(s2) s2.textContent = e&&e.code==="unsupported_type" ? "Use a JPG, PNG or WebP image." : e&&e.code==="quota_or_state" ? "Poster storage is full." : "Upload failed. Try again."; }
}
async function sendPrayer(){
  if(!S.db || !S.uid){ toast("Sign in to Claude to send this"); return; }
  const name=$("pName").value.trim(), text=$("pText").value.trim();
  if(!name||!text){ toast("Add your name and your request"); return; }
  const phone = normPhone($("pPhone").value);
  lsSet("cpic.pname",name); lsSet("cpic.pphone",$("pPhone").value.trim());
  const isT = S.pKind==="testimony";
  const id = uid8();
  const item = {kind:isT?"testimony":"prayer", text, name, phone, createdAt:new Date().toISOString(), status:"new",
    category: isT?"Testimony":$("pCat").value, callback: !isT && $("pCallback").checked, share: isT && $("pShare").checked, showName: isT && $("pShowName").checked};
  const ref = S.db.doc("prayers/"+S.uid);
  try{
    const snap = await retry(()=>ref.get());
    if(snap.exists) await retry(()=>ref.update({name, items:{[id]:item}}));
    else await retry(()=>ref.set({name, items:{[id]:item}}));
    $("pText").value="";
    toast(isT?"Thank you! Your testimony was sent.":"Sent. The pastor will pray for you.");
  }catch(e){
    if(e && e.code==="invalid_argument"){ S.canPray=false; render(); syncWa(); toast("Your access can’t save requests here. Send it on WhatsApp instead."); }
    else toast("Could not send. Check your connection and try again.");
  }
}

/* ---------- personal sermon notes ---------- */
let notesT=null, notesFor=null;
async function loadMyNotes(id){
  notesFor=id; const ta=$("myNotes"); if(!ta) return;
  const local = lsGet("cpic.notes."+id,"");
  if(S.myNotes[id]!=null){ ta.value=S.myNotes[id]; return; }
  ta.value=local;
  if(S.db && S.uid){
    try{ const d = await S.db.collection("data/users/"+S.uid).doc("sermon-"+id).get(); if(notesFor!==id) return;
      if(d.exists){ const v=(d.data()||{}).text||""; S.myNotes[id]=v; const t2=$("myNotes"); if(t2 && document.activeElement!==t2) t2.value=v; } }catch(_){}
  }
}
function saveMyNotes(id, v){
  S.myNotes[id]=v; lsSet("cpic.notes."+id,v);
  const st=$("notesState");
  clearTimeout(notesT);
  notesT=setTimeout(async()=>{
    if(!(S.db && S.uid)){ if(st) st.textContent="Saved on this device."; return; }
    try{ await S.db.collection("data/users/"+S.uid).doc("sermon-"+id).set({text:v, updatedAt:new Date().toISOString()}); const s2=$("notesState"); if(s2) s2.textContent="Saved · private to you"; }
    catch(_){ const s2=$("notesState"); if(s2) s2.textContent="Saved on this device only."; }
  }, 900);
  if(st) st.textContent="Saving…";
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,a");
  if(!t){ if(e.target.id==="scrim"){ S.posterView=null; renderSheet(); } return; }
  /* sermons */
  if(t.dataset.skind){ S.sermonKind=t.dataset.skind; render(); return; }
  if(t.id==="newSermon"){ S.sermonEdit={id:null, draft:{date:lastSunday(today()), kind:"Sunday sermon"}}; S.aiMsg=""; render(); window.scrollTo(0,0); return; }
  if(t.id==="editSermon"){ const s=S.sermons.find(x=>x.id===S.sermonId); if(!s) return; S.sermonEdit={id:s.id, draft:JSON.parse(JSON.stringify(s))}; S.aiMsg=""; location.hash="sermons"; return; }
  if(t.id==="cancelSermon"||t.id==="cancelSermon2"){ e.preventDefault(); if(S.aiCtl) S.aiCtl.abort(); S.sermonEdit=null; S.aiBusy=false; S.aiMsg=""; if(location.hash!=="#sermons") location.hash="sermons"; else render(); return; }
  if(t.id==="aiGo"){ runAI(); return; }
  if(t.id==="aiStop"){ if(S.aiCtl) S.aiCtl.abort(); return; }
  if(t.id==="delSermon"){
    const id=S.sermonEdit&&S.sermonEdit.id; if(!id) return;
    if(S.delArm!=="s:"+id){ S.delArm="s:"+id; render(); setTimeout(()=>{ if(S.delArm==="s:"+id){ S.delArm=null; render(); } },4000); return; }
    if(!guard()) return; S.delArm=null;
    retry(()=>S.db.collection("sermons").doc(id).delete()).then(()=>{ toast("Sermon deleted"); S.sermonEdit=null; render(); }).catch(writeErr); return; }
  /* events */
  if(t.dataset.evf){ S.evFilter=t.dataset.evf; render(); return; }
  if(t.id==="togglePast"){ S.evPast=!S.evPast; render(); return; }
  if(t.id==="newEvent"){ S.evEdit={id:null, draft:{category:"Special service"}}; render(); window.scrollTo(0,0); return; }
  if(t.dataset.editEv){ const ev=S.events.find(x=>x.id===t.dataset.editEv); if(!ev) return; S.evEdit={id:ev.id, draft:{...ev}}; render(); window.scrollTo(0,0); return; }
  if(t.dataset.poster){ S.posterView=t.dataset.poster; renderSheet(); return; }
  if(t.id==="closePoster"){ S.posterView=null; renderSheet(); return; }
  if(t.id==="rmPoster"){ S.evEdit.draft = readEventDraft(); delete S.evEdit.draft.posterId; S.evEdit.draft.posterId=""; render(); return; }
  if(t.id==="cancelEvent"||t.id==="cancelEvent2"){ e.preventDefault(); S.evEdit=null; render(); return; }
  if(t.id==="delEvent"){
    const id=S.evEdit&&S.evEdit.id; if(!id) return;
    if(S.delArm!=="e:"+id){ S.delArm="e:"+id; render(); setTimeout(()=>{ if(S.delArm==="e:"+id){ S.delArm=null; render(); } },4000); return; }
    if(!guard()) return; S.delArm=null;
    retry(()=>S.db.collection("events").doc(id).delete()).then(()=>{ toast("Event deleted"); S.evEdit=null; render(); }).catch(writeErr); return; }
  /* prayer */
  if(t.dataset.pwa!==undefined){
    const txt=$("pText"), nm=$("pName");
    if(!txt.value.trim() || !nm.value.trim()){ e.preventDefault(); toast("Add your name and your request first"); return; }
    lsSet("cpic.pname",nm.value.trim()); lsSet("cpic.pphone",$("pPhone").value.trim()); syncWa(); return; }
  if(t.dataset.prtab){ S.prTab=t.dataset.prtab; render(); return; }
  if(t.dataset.pkind){ S.pKind=t.dataset.pkind; render(); return; }
  if(t.dataset.inf){ S.inboxFilter=t.dataset.inf; render(); return; }
  if(t.dataset.withdraw){ const id=t.dataset.withdraw; if(!S.uid) return;
    retry(()=>S.db.doc("prayers/"+S.uid).update({items:{[id]:{withdrawn:true}}})).then(()=>toast("Request removed")).catch(()=>toast("Could not remove it. Try again.")); return; }
  if(t.dataset.prayed || t.dataset.tread){
    if(!guard()) return; const [owner,id]=(t.dataset.prayed||t.dataset.tread).split("|");
    const noteEl=$("note_"+id); const note=noteEl?noteEl.value.trim():"";
    const patch = t.dataset.prayed ? {status:"prayed", prayedAt:today(), ...(note?{pastorNote:note}:{})} : {status:"read"};
    retry(()=>S.db.doc("prayers/"+owner).update({items:{[id]:patch}})).then(()=>toast(t.dataset.prayed?"Marked as prayed. They can see it in their requests.":"Marked as read")).catch(writeErr); return; }
  if(t.dataset.wall){
    if(!guard()) return; const [owner,id]=t.dataset.wall.split("|");
    const it = allPrayerItems().find(x=>x.owner===owner && x.id===id); if(!it) return;
    const body = {text:it.text, name: it.showName ? it.name : "", date:(it.createdAt||"").slice(0,10)||today(), from:owner};
    retry(()=>S.db.collection("testimonyWall").doc(id).set(body))
      .then(()=>retry(()=>S.db.doc("prayers/"+owner).update({items:{[id]:{status:"shared"}}})))
      .then(()=>toast("Shared on the testimony wall")).catch(writeErr); return; }
  if(t.dataset.unwall){
    if(!guard()) return; const id=t.dataset.unwall, owner=t.dataset.owner;
    retry(()=>S.db.collection("testimonyWall").doc(id).delete())
      .then(()=> owner ? retry(()=>S.db.doc("prayers/"+owner).update({items:{[id]:{status:"read"}}})).catch(()=>{}) : null)
      .then(()=>toast("Removed from the wall")).catch(writeErr); return; }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.closest && t.closest("#prayerForm")) syncWa();
  if(t.id==="sermonSearch"){ S.sermonQuery=t.value; render(); }
  else if(t.id==="myNotes" && S.sermonId){ saveMyNotes(S.sermonId, t.value); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.closest && t.closest("#prayerForm")) syncWa();
  if(t.id==="eRepeat"){ S.evEdit.draft = readEventDraft(); render(); }
  if(t.id==="ePoster"){ uploadPoster(t.files && t.files[0]); t.value=""; }
});
document.addEventListener("submit", e=>{
  e.preventDefault(); const f=e.target;
  if(false){  } else if(f.id==="sermonForm"){ saveSermon(); }
  else if(f.id==="eventForm"){ saveEvent(); }
  else if(f.id==="prayerForm"){ sendPrayer(); }
  else if(f.id==="churchForm"){
    if(!guard()) return; const wa=normPhone($("churchWa").value);
    retry(()=>S.db.collection("settings").doc("church").set({...(S.church||{}), whatsapp:wa})).then(()=>toast("Church WhatsApp number saved")).catch(writeErr);
  }
});

/* ---------- routing ---------- */
const VIEWS=["sermons","events","prayer","follow"];
function route(){
  const h=location.hash.replace("#","");
  S.sheetId=null; S.delArm=null;
  if(h.startsWith("sermon-")){ S.view="sermon"; S.sermonId=h.slice(7); }
  else S.view = VIEWS.includes(h)?h:"sermons";
  if(S.view!=="sermons") { if(S.aiCtl && S.aiBusy) S.aiCtl.abort(); S.sermonEdit=null; }
  if(S.view!=="events") S.evEdit=null;
  render(); window.scrollTo(0,0);
  if(S.view==="sermon") setTimeout(()=>loadMyNotes(S.sermonId),0);
}
window.addEventListener("hashchange", route);

/* ---------- sync status ---------- */
function setSync(){
  const dot=$("syncDot"), txt=$("syncText");
  if(!S.db){ dot.className="dot"; txt.textContent = SNAP.at ? "Updated "+fmt(SNAP.at.slice(0,10)) : ""; return; }
  const all = S.need.every(k=>S.loaded[k]);
  if(all && !S.stale){ dot.className="dot on"; txt.textContent="Live"; }
  else { dot.className="dot wait"; txt.textContent = S.stale?"Reconnecting":"Connecting"; }
}

/* ---------- boot ---------- */
async function boot(){
  S.ready = true; route(); setSync();
  let db=null, user=null;
  if(window.claude && claude.use){ try{ [db,user] = await Promise.all([claude.use("db"), claude.use("user")]); }catch(_){} }
  S.db = db;
  if(user){ try{ S.uid = await user.id(); }catch(_){} try{ S.isTeam = !!(await user.canEdit()); }catch(_){} }
  if(S.isTeam){ try{ S.assets = await claude.use("assets"); }catch(_){} }
  S.ready = true;
  if(!db){ render(); setSync(); return; }
  S.need = ["sermons","events","wall"].concat(S.isTeam?["prayers"]:[]);
  const timer = setTimeout(()=>{ S.stale=true; S.need.forEach(k=>S.loaded[k]=true); render(); setSync(); }, 10000);
  const done = k => { S.loaded[k]=true; if(S.need.every(x=>S.loaded[x])){ clearTimeout(timer); S.stale=false; } setSync(); };
  const onErr = k => e => { done(k); if(e && e.code==="revoked"){ S.db=null; } render(); setSync(); };
  const live = {sermons:true, events:true, wall:true};
  const plain = d => ({id:d.id, ...JSON.parse(JSON.stringify(d.data()||{}))});
  const sub = (path, key, apply) => db.collection(path).onSnapshot(snap=>{ if(live[key] && snap.metadata.fromCache && snap.empty) return; apply(snap); if(!snap.metadata.fromCache) done(key); render(); if(S.view==="sermon" && key==="sermons") loadMyNotes(S.sermonId); }, onErr(key));
  sub("sermons","sermons", snap=>{ S.sermons = snap.docs.map(plain); });
  sub("events","events", snap=>{ S.events = snap.docs.map(plain); });
  sub("testimonyWall","wall", snap=>{ S.wall = snap.docs.map(plain); });
  db.doc("settings/church").onSnapshot(d=>{ if(d.exists) S.church = JSON.parse(JSON.stringify(d.data())); else if(!d.metadata.fromCache) S.church = SNAP.church||{}; render(); }, ()=>{});
  if(S.uid) db.doc("prayers/"+S.uid).onSnapshot(d=>{ S.myPrayer = d.exists ? JSON.parse(JSON.stringify(d.data())) : null; if(S.view==="prayer") render(); }, ()=>{});
  if(S.isTeam){
    sub("prayers","prayers", snap=>{ S.prayers = snap.docs.map(plain); });
  }
  route(); setSync();
}
boot();
})();
</script>
