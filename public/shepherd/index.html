<style>

  color-scheme:dark}
*{box-sizing:border-box}

@media (max-width:560px){.ncrow{flex-wrap:wrap}.ncrow .item{flex-basis:100%}.ncrow .item .name,.ncrow .item .sub{white-space:normal}.ncrow .steps{display:none}.stagebtn{margin:-4px 14px 12px auto}}
.phonefield{display:flex;gap:6px}.phonefield select{width:auto;max-width:46%;flex:none}.phonefield input{flex:1;min-width:0}

.ncrow:has(.editbtn){flex-wrap:nowrap!important}.ncrow:has(.editbtn) .item{flex-basis:auto!important}

/* tab bar */

.tabs a svg{width:22px;height:22px}
@media (max-width:440px){.tabs a{font-size:10.5px;letter-spacing:-.01em}.tabs a svg{width:21px;height:21px}}

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };

const weekStart = s => { const d = parse(s); d.setDate(d.getDate()-d.getDay()); return iso(d); };

function normPhone(raw, cc){
  const s = String(raw||"").trim(); if(!s) return "";
  let d = s.replace(/\D/g,"");
  if(!d) return "";
  if(s.startsWith("+")) return "+"+d;
  if(d.startsWith("00")) return "+"+d.slice(2);
  cc = cc || "+971"; const ccd = cc.slice(1);
  if(d.startsWith(ccd) && d.length >= ccd.length+8) return "+"+d;   /* typed with the country code but no + */
  d = d.replace(/^0+/,"");
  return cc+d;
}

const readDM = id => { const d=$(id+"_d")&&$(id+"_d").value, m=$(id+"_m")&&$(id+"_m").value; return d&&m?m+"-"+d:""; };

}

/* ---------- derived ---------- */
function stepDue(n, step){ return addDays(n.firstVisit||today(), step.offset); }
function followups(){
  const t = today(); const out = [];
  for(const n of S.newcomers){
    if(!n.consent || !n.phone || n.status==="member" || n.status==="inactive") continue;
    const steps = n.steps||{};
    if(JUST[n.id] && Date.now()-JUST[n.id].t<8000){ const st=STEPS.find(x=>x.key===JUST[n.id].key), due=stepDue(n,st), diff=daysBetween(t,due); out.push({n, st, due, diff, bucket: diff<0?"overdue":diff===0?"today":"soon", done:true}); continue; }
    for(const st of STEPS){
      if(steps[st.key]) continue;
      const due = stepDue(n,st);
      const diff = daysBetween(t,due);
      if(diff>7) break;
      out.push({n, st, due, diff, bucket: diff<0?"overdue":diff===0?"today":"soon"});
      break; // one step at a time per person
    }
  }
  out.sort((a,b)=> a.due<b.due?-1:a.due>b.due?1:0);
  return out;
}
function fillTpl(key, n){
  const tpl = (S.templates && S.templates[key]) || DEFAULT_TPL[key];
  return tpl.replaceAll("{name}", firstName(n.name)).replaceAll("{sender}", S.sender.trim() || "the CPIC team");
}
function svc(date){ return S.services[date] || {date, label:isSunday(date)?"Sunday Service":"Special service", tallies:{men:0,women:0,youth:0,children:0}, present:[], presentNc:[]}; }
function headcount(s){ const t=s.tallies||{}; return GROUPS.reduce((a,[k])=>a+(Number(t[k])||0),0); }

/* ---------- attendance (members, newcomers and regulars) ---------- */
const isSunday = d => parse(d).getDay()===0;
const taken = s => ((s.present||[]).length + (s.presentNc||[]).length) > 0;
function svcList(){ return Object.values(S.services).filter(s=>s.date<=today()).sort((a,b)=>a.date.localeCompare(b.date)); }
function visitsOf(n){ const dates=[]; if(n.firstVisit) dates.push(n.firstVisit); for(const s of Object.values(S.services)){ if(s.date!==n.firstVisit && (s.presentNc||[]).includes(n.id)) dates.push(s.date); } dates.sort(); return {count:dates.length, last:dates[dates.length-1]||null, dates}; }
function memberLast(m){ let last=null; for(const s of Object.values(S.services)) if((s.present||[]).includes(m.id) && (!last||s.date>last)) last=s.date;
  if(m.fromNewcomer){ const n=S.newcomers.find(x=>x.id===m.fromNewcomer); if(n){ const v=visitsOf(n).last; if(v&&(!last||v>last)) last=v; } } return last; }
function missedSince(last){ if(!last) return 0; return svcList().filter(s=>s.date>last && taken(s)).length; }
function readyToConfirm(n){ return n.status==="returned" && n.firstVisit && daysBetween(n.firstVisit,today())>=BUFFER_DAYS && visitsOf(n).count>=READY_MIN; }
function missingPeople(){ const out=[];
  for(const n of S.newcomers){ if(n.status!=="returned"||!n.phone||!n.consent) continue; const last=visitsOf(n).last; const k=missedSince(last); if(k>=MISS_N && !(n.missedSent && n.missedSent>last)) out.push({kind:"nc",id:n.id,name:n.name,phone:n.phone,last,k,stage:"Regular"}); }
  for(const m of S.members){ if(!m.phone) continue; const last=memberLast(m); if(!last) continue; const k=missedSince(last); if(k>=MISS_N && !(m.missedSent && m.missedSent>last)) out.push({kind:"m",id:m.id,name:m.name,phone:normPhone(m.phone),last,k,stage:"Member"}); }
  return out.sort((a,b)=>b.k-a.k); }
/* follow-up team: new people are shared out to whoever has the fewest */
function nextOwner(){ if(!S.team.length) return ""; const load=Object.fromEntries(S.team.map(t=>[t,0])); for(const n of S.newcomers) if(inBuffer(n) && n.owner in load) load[n.owner]++; return S.team.slice().sort((a,b)=>load[a]-load[b])[0]; }
const me = () => S.sender.trim();
const logE = (what, i=0) => ({[String(Date.now()+i)]:{at:new Date().toISOString(), by:me()||"Someone", what}});
function findDup(name, phone, exceptId){ const nm=String(name||"").trim().toLowerCase();
  const n=S.newcomers.find(x=>x.id!==exceptId && ((phone && x.phone===phone) || (nm && String(x.name||"").trim().toLowerCase()===nm)));
  if(n) return {kind:"nc", rec:n, why: phone && n.phone===phone ? "number" : "name"};
  const m=S.members.find(x=>(phone && normPhone(x.phone)===phone) || (nm && String(x.name||"").trim().toLowerCase()===nm));
  if(m) return {kind:"m", rec:m, why: phone && normPhone(m.phone)===phone ? "number" : "name"};
  return null; }

  for(const d of Object.keys(S.services)) if(!isSunday(d) && !list.includes(d)) list.push(d);
  if(sel && !list.includes(sel)) list.push(sel); list.sort((a,b)=>b.localeCompare(a));
  return list.map(d=>`<option value="${d}" ${d===sel?"selected":""}>${parse(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}${isSunday(d)?(d===last?" · latest":""):" · "+esc((S.services[d]||{}).label||"Special service")}</option>`).join(""); }
function celebrations(){ const out=[]; const t=today();
  for(let i=0;i<7;i++){ const d=addDays(t,i), md=d.slice(5);
    for(const m of S.members){ if(!m.phone) continue; if(m.birthday===md) out.push({type:"birthday",pid:"m_"+m.id,name:m.name,phone:normPhone(m.phone),date:d,kind:"Member"}); if(m.anniversary===md) out.push({type:"anniversary",pid:"m_"+m.id,name:m.name,phone:normPhone(m.phone),date:d,kind:"Member"}); }
    for(const n of S.newcomers){ if(!n.consent||!n.phone||!inBuffer(n)) continue; if(n.birthday===md) out.push({type:"birthday",pid:"n_"+n.id,name:n.name,phone:n.phone,date:d,kind:STATUS[n.status||"new"][0]}); } }
  return out; }
function prayerList(days){ const from=addDays(today(),-days), out=[];

    if(n.notes && n.firstVisit && n.firstVisit>=from) out.push({id:n.id,name:n.name,text:n.notes,at:n.firstVisit,by:"Visitor card"}); }

  if(S.view==="sunday") html += viewSunday();
  else if(S.view==="newcomers") html += viewNewcomers();
  else if(S.view==="follow-up") html += viewFollowup();

}
/* keep what someone is typing when a teammate's update re-renders the page */
function captureUI(){
  const app=$("app"); const vals=[];
  app.querySelectorAll("input,select,textarea").forEach(el=>{
    if(!el.id || el.type==="search") return;
    vals.push({id:el.id, k: el.form ? (el.form.dataset.k||"") : "", v: el.type==="checkbox" ? el.checked : el.value});
  });
  const a=document.activeElement;
  const foc = a && a.id && app.contains(a) ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  return {vals, foc};
}
function restoreUI(ui){
  for(const x of ui.vals){
    const el=$(x.id); if(!el) continue;
    if((el.form ? (el.form.dataset.k||"") : "") !== x.k) continue;
    if(x.id==="svcDate" || x.id==="svcLabel" || x.id==="senderName" || x.id==="grpMsg") continue;
    if(el.type==="checkbox") el.checked=x.v; else el.value=x.v;
  }
  if(ui.foc){ const el=$(ui.foc.id); if(el){ try{ el.focus({preventScroll:true}); if(ui.foc.s!=null) el.setSelectionRange(ui.foc.s, ui.foc.e); }catch(_){} } }
}

function viewSunday(){
  const s = svc(S.date); const hc = headcount(s); const sun=isSunday(S.date);
  const ncToday = S.newcomers.filter(n=>n.firstVisit===S.date);
  const present = new Set(s.present||[]), presentNc = new Set(s.presentNc||[]);
  const q = S.memberQuery.trim().toLowerCase();
  const members = S.members.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)))
    .filter(m=>!q || String(m.name).toLowerCase().includes(q));
  const ncs = S.newcomers.filter(n=>(n.status==="new"||n.status==="returned"||!n.status) && n.firstVisit && n.firstVisit<S.date && daysBetween(n.firstVisit,S.date)<=200)
    .filter(n=>!q || String(n.name).toLowerCase().includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name)));

      <button class="btn" id="prevSun" aria-label="Previous Sunday">‹ Previous</button>

      <button class="btn" id="nextSun" aria-label="Next Sunday" ${addDays(lastSunday(S.date),7)>today()?"disabled":""}>Next ›</button>
    </div>

    ${S.spForm?`<div class="grid2" style="align-items:end"><div class="field"><label for="spDate">Date of the special service</label><input type="date" id="spDate" max="${today()}" value="${today()}"></div>
      <div class="field"><label for="spName">Name</label><input type="text" id="spName" placeholder="e.g. Good Friday service, Convention night 1"></div>
      <div class="row"><button class="btn primary" id="spGo" ${dis}>Open it</button><button class="btn ghost" id="spCancel">Cancel</button></div></div>`
    :`<button class="btn ghost" id="spOpen" style="align-self:flex-start" ${dis}>+ Record a special service (not on a Sunday)</button>`}
  </section>
  <div class="total-bar"><div><div class="label" style="color:inherit;opacity:.85">Headcount</div><div class="big num">${hc}</div></div>
    <div class="meta num">${present.size} members · ${presentNc.size} returning newcomers & regulars ticked · ${ncToday.length} newcomer${ncToday.length===1?"":"s"} registered</div></div>
  <section class="section">
    <div class="section-head"><h3>Usher count</h3><span class="small muted">Tap + as people walk in</span></div>
    <div class="tallies">${GROUPS.map(([k,l])=>`
      <div class="tally"><span class="label">${l}</span><span class="n num">${Number((s.tallies||{})[k])||0}</span>
        <div class="ctl"><button aria-label="Remove one from ${l}" data-tally="${k}" data-d="-1" ${dis}>−</button><button class="plus" aria-label="Add one to ${l}" data-tally="${k}" data-d="1" ${dis}>+</button></div></div>`).join("")}
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h3>Roll call</h3><button class="btn" id="toggleMemberForm" ${dis}>${S.memberFormOpen&&!S.memberEditId?"Close":"Add member"}</button></div>
    ${S.memberFormOpen?`
    <form id="memberForm" data-k="${esc(S.memberEditId||"new")}" class="grid2" autocomplete="off">
      <div class="field" style="grid-column:1/-1"><b>${S.memberEditId?"Edit "+esc(me_.name):"New member"}</b></div>
      <div class="field"><label for="mName">Full name</label><input type="text" id="mName" required value="${esc(me_.name)}"></div>
      <div class="field"><label for="mPhone">Phone</label><div class="phonefield"><select id="mCC" aria-label="Country code">${ccOptions(mcc)}</select><input type="tel" id="mPhone" placeholder="50 123 4567" value="${esc(mnum)}"></div></div>
      <div class="field"><label for="mGroup">Group</label><select id="mGroup">${GROUPS.map(([k,l])=>`<option value="${k}" ${me_.group===k?"selected":""}>${l}</option>`).join("")}</select></div>
      ${dayMonthSel("mBday",me_.birthday,"Birthday (optional)")}
      ${dayMonthSel("mAnniv",me_.anniversary,"Wedding anniversary (optional)")}
      <div class="row" style="grid-column:1/-1"><button class="btn primary" type="submit">${S.memberEditId?"Save changes":"Save member"}</button><button class="btn ghost" type="button" id="cancelMember">Cancel</button>${S.memberEditId?`<button class="btn danger" type="button" id="delMember">${S.mDelArm?"Tap again to remove":"Remove member"}</button>`:""}</div>
    </form>`:""}
    <input type="search" id="memberSearch" placeholder="Search names" value="${esc(S.memberQuery)}" aria-label="Search names">
    <div class="label" style="margin-top:2px">Members</div>
    <div class="list" id="memberList">${
      !S.loaded.m && S.db ? `<div class="empty">Loading members…</div>` :
      members.length ? members.map(m=>`<div class="ncrow">
        <button class="item" data-member="${esc(m.id)}" aria-pressed="${present.has(m.id)}" ${dis}>
          <span class="avatar">${esc(initials(m.name))}</span>
          <span class="main"><span class="name" style="display:block">${esc(m.name)}</span><span class="sub" style="display:block">${esc((GROUPS.find(g=>g[0]===m.group)||[0,""])[1])}${m.phone?" · "+esc(prettyPhone(normPhone(m.phone))):""}${m.birthday?" · 🎂 "+esc(fmtDM(m.birthday)):""}</span></span>
          ${tick(present.has(m.id))}
        </button><button class="btn editbtn" data-medit="${esc(m.id)}" aria-label="Edit ${esc(m.name)}" ${dis}>Edit</button></div>`).join("") :
      S.members.length ? `<div class="empty">No member matches “${esc(S.memberQuery)}”.</div>` :
      `<div class="empty"><b>No members on the register yet</b>Add your regular members with “Add member”, then tick them off each service. Newcomers who become members are added here automatically.</div>`
    }</div>
    <div class="label" style="margin-top:8px">Newcomers & Regulars who came back</div>
    <p class="small muted" style="margin:0">Tick anyone who came again. A Newcomer who comes back becomes a Regular automatically, and every tick counts towards their 3 months.</p>
    <div class="list">${ncs.length?ncs.map(n=>{ const v=visitsOf(n); return `
      <button class="item gitem" data-ncp="${esc(n.id)}" aria-pressed="${presentNc.has(n.id)}" ${dis}>
        <span class="avatar">${esc(initials(n.name))}</span>
        <span class="main"><span class="name" style="display:block">${esc(n.name)} <span class="muted" style="font-weight:500">(${n.status==="returned"?"Regular":"Newcomer"})</span></span><span class="sub" style="display:block">First came ${esc(fmt(n.firstVisit))} · came ${v.count} time${v.count===1?"":"s"}</span></span>
        ${tick(presentNc.has(n.id))}
      </button>`; }).join(""):`<div class="empty">${q?"Nobody matches.":"Nobody to tick yet. People registered on earlier Sundays appear here."}</div>`}</div>
    ${ncToday.length?`<p class="small muted" style="margin:0">Registered at this service: ${ncToday.map(n=>esc(n.name)).join(", ")}.</p>`:""}
  </section>`;
}

function bySunday(list){ const by={}; for(const n of list){ const d=n.firstVisit; const k=!d?"unknown":(isSunday(d)||S.services[d])?d:lastSunday(d); (by[k]=by[k]||[]).push(n); }
  return Object.keys(by).sort((a,b)=>b.localeCompare(a)).map(k=>{ const ns=by[k]; const cnt=st=>ns.filter(n=>(n.status||"new")===st).length;
    const head=k==="unknown"?"No date recorded":!isSunday(k)?((S.services[k]||{}).label||"Special service")+" · "+fmtLong(k):(k===lastSunday(today())?"This Sunday · ":"")+fmtLong(k);
    const bits=[cnt("new")&&`${cnt("new")} newcomer${cnt("new")===1?"":"s"}`,cnt("returned")&&`${cnt("returned")} regular${cnt("returned")===1?"":"s"}`,cnt("member")&&`${cnt("member")} member${cnt("member")===1?"":"s"}`].filter(Boolean).join(" · ");
    const mixed=["new","returned","member","inactive"].filter(x=>cnt(x)).length>1;
    return `<details class="sun" ${S.sunClosed&&S.sunClosed[k]?"":"open"} data-sun="${k}"><summary><span class="sun-h">${esc(head)}</span><span class="sun-c num">${ns.length} ${ns.length===1?"person":"people"}${mixed&&bits?" · "+bits:""}</span></summary><div class="list">${ns.map(ncRow).join("")}</div></details>`; }).join(""); }
function ncRow(n){
  const st = STATUS[n.status||"new"]||STATUS.new;
  const steps = n.steps||{};
  const t = today();
  const nx=STAGE_NEXT[n.status||"new"];
  return `<div class="ncrow"><button class="item" data-nc="${esc(n.id)}">
    <span class="avatar">${esc(initials(n.name))}</span>
    <span class="main"><span class="name" style="display:block">${esc(n.name)}</span>
      <span class="sub" style="display:block">${esc([n.nationality, n.occupation].filter(Boolean).join(" · ")||"No details yet")} · first came ${esc(fmt(n.firstVisit))}${inBuffer(n)?` · came ${visitsOf(n).count}×`:""}</span>
      <span class="pills"><span class="pill ${st[1]}">${st[0]}</span>${readyToConfirm(n)?`<span class="pill ok">Ready to confirm</span>`:""}${n.owner&&inBuffer(n)?`<span class="pill acc">${esc(n.owner)}</span>`:""}${fellowOf(n)&&inBuffer(n)?`<span class="pill">${esc(FNAME[fellowOf(n)])}</span>`:""}${n.visa?`<span class="pill">${esc(n.visa)}</span>`:""}${n.work==="Looking for a job"?`<span class="pill warn">Job seeking</span>`:n.work?`<span class="pill">${esc(n.work)}</span>`:""}</span>
    </span>
    <span class="steps" title="Follow-up progress">${STEPS.map(s=>`<i class="${steps[s.key]?"done":(stepDue(n,s)<=t&&n.consent?"due":"")}"></i>`).join("")}</span>
  </button>${nx&&S.canWrite?`<button class="btn stagebtn" data-stage="${esc(n.id)}|${nx[0]}">${nx[1]}</button>`:""}</div>`;
}

function viewNewcomers(){
  const q = S.ncQuery.trim().toLowerCase();
  let list = S.newcomers.slice().sort((a,b)=> (b.firstVisit||"").localeCompare(a.firstVisit||"") || String(a.name).localeCompare(String(b.name)));
  const f = S.ncFilter;
  if(f==="jobs") list = list.filter(n=>n.work==="Looking for a job");
  else if(f==="visit") list = list.filter(n=>n.visa==="Visit visa");
  else if(f==="month"){ const m=today().slice(0,7); list=list.filter(n=>(n.firstVisit||"").startsWith(m)); }
  else if(f==="new") list = list.filter(n=>(n.status||"new")==="new");
  else if(f==="regular") list = list.filter(n=>n.status==="returned");
  else if(f==="member") list = list.filter(n=>n.status==="member");
  if(q) list = list.filter(n=>[n.name,n.nationality,n.occupation,n.phone,n.area,n.invitedBy].join(" ").toLowerCase().includes(q));
  const e = S.editingId ? S.newcomers.find(n=>n.id===S.editingId) || {} : {};
  const dis = S.canWrite?"":"disabled";
  return `
  <div class="section-head"><div><h2 class="view-title">Newcomers</h2><p class="view-sub num">${S.newcomers.length} recorded · ${S.newcomers.filter(n=>n.firstVisit && weekStart(n.firstVisit)===weekStart(today())).length} this week</p></div>
    <button class="btn primary" id="openForm" ${dis}>${S.formOpen && !S.editingId?"Close form":"Register newcomer"}</button></div>
  ${S.formOpen?`
  <section class="section" id="ncFormWrap">
    <h3>${S.editingId?"Edit "+esc(e.name):"New visitor card"}</h3>
    <form id="ncForm" data-k="${esc(S.editingId||"new")}" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <div class="grid2">
        <div class="field"><label for="fName">Full name</label><input type="text" id="fName" required value="${esc(e.name)}"></div>
        <div class="field"><label for="fPhone">WhatsApp number</label><div class="phonefield"><select id="fCC" aria-label="Country code">${ccOptions(splitPhone(e.phone)[0])}</select><input type="tel" id="fPhone" placeholder="50 123 4567" value="${esc(splitPhone(e.phone)[1])}"></div><span class="hint">Pick their country, then type the number as they wrote it.</span></div>
        <div class="field"><label for="fGender">Gender</label><select id="fGender"><option value="">Select</option>${["Male","Female"].map(g=>`<option ${e.gender===g?"selected":""}>${g}</option>`).join("")}</select></div>
        <div class="field"><label for="fFellow">Group</label><select id="fFellow"><option value="">Same as gender (Men or Women)</option>${FELLOW.map(([k,l])=>`<option value="${k}" ${e.fellowship===k?"selected":""}>${l}</option>`).join("")}</select><span class="hint">Choose Youth or Teens for younger people.</span></div>
        <div class="field"><label for="fNation">Nationality</label><input type="text" id="fNation" list="nations" value="${esc(e.nationality)}"><datalist id="nations">${NATIONS.map(x=>`<option value="${x}">`).join("")}</datalist></div>
        <div class="field"><label for="fVisa">Visa status in UAE</label><select id="fVisa"><option value="">Select</option>${VISA.map(v=>`<option ${e.visa===v?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label for="fWork">Work situation</label><select id="fWork"><option value="">Select</option>${WORK.map(v=>`<option ${e.work===v?"selected":""}>${v}</option>`).join("")}</select></div>
        <div class="field"><label for="fOcc">Occupation / profession</label><input type="text" id="fOcc" placeholder="e.g. Nurse, Accountant" value="${esc(e.occupation)}"></div>
        <div class="field"><label for="fArea">Lives in</label><input type="text" id="fArea" placeholder="e.g. Al Qusais, Sharjah" value="${esc(e.area)}"></div>
        <div class="field"><label for="fInvited">Invited by / heard about us</label><input type="text" id="fInvited" placeholder="Friend's name, Instagram, walked in…" value="${esc(e.invitedBy)}"></div>
        <div class="field"><label for="fFirst">First visit</label><select id="fFirst">${dateOptions(e.firstVisit?((isSunday(e.firstVisit)||S.services[e.firstVisit])?e.firstVisit:lastSunday(e.firstVisit)):S.date,104)}</select><span class="hint">The service they first came to.</span></div>
        ${dayMonthSel("fBday",e.birthday,"Birthday (optional)")}
      </div>
      <div class="field"><label for="fNotes">Prayer request or notes</label><textarea id="fNotes">${esc(e.notes)}</textarea></div>
      <label class="check"><input type="checkbox" id="fConsent" ${e.consent===false?"":"checked"}><span>They are happy for CPIC to contact them on WhatsApp</span></label>
      ${S.dupWarn?`<div class="banner"><b>Already recorded?</b> This ${S.dupWarn.why==="number"?"number":"name"} belongs to <b>${esc(S.dupWarn.rec.name)}</b> (${S.dupWarn.kind==="m"?"member":esc(STATUS[S.dupWarn.rec.status||"new"][0])+", first came "+esc(fmt(S.dupWarn.rec.firstVisit))}).
        <div class="row" style="margin-top:8px">${S.dupWarn.kind==="nc"?`<button class="btn" type="button" data-nc="${esc(S.dupWarn.rec.id)}">Open their record</button>`:""}<button class="btn" type="button" id="dupSave">It’s a different person, save anyway</button></div></div>`:""}
      <div class="row"><button class="btn primary" type="submit">${S.editingId?"Save changes":"Save newcomer"}</button><button class="btn ghost" type="button" id="cancelForm">Cancel</button></div>
    </form>
  </section>`:""}
  <input type="search" id="ncSearch" placeholder="Search name, nationality, job, area" value="${esc(S.ncQuery)}" aria-label="Search newcomers">
  <div class="seg" role="group" aria-label="Filter">${[["all","Everyone"],["new","Newcomers"],["regular","Regulars"],["member","Members"],["month","This month"],["jobs","Job seeking"],["visit","On visit visa"]].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${S.ncFilter===k}">${l}</button>`).join("")}</div>
  <p class="view-sub" style="margin:0">Newcomer (first Sunday) → Regular (came back; moves automatically when ticked on a later Sunday) → Member (confirmed after 3 months of coming regularly).</p>
  ${(()=>{ const r=S.newcomers.filter(readyToConfirm); return r.length?`<section class="section" style="border-color:var(--ok)"><h3>Ready to confirm as members <span class="muted num" style="font-weight:500">${r.length}</span></h3><p class="small muted" style="margin:0">3 months since their first visit, and they’ve come at least ${READY_MIN} times.</p><div class="list">${r.map(ncRow).join("")}</div></section>`:""; })()}
  <div class="sundays">${
    !S.loaded.n && S.db ? `<div class="empty">Loading newcomers…</div>` :
    list.length ? bySunday(list) :
    S.newcomers.length ? `<div class="empty">Nobody matches this filter.</div>` :
    `<div class="empty"><b>No newcomers recorded yet</b>Tap “Register newcomer” when a first-time visitor fills in their card. Their welcome message shows up under Follow-up straight away.</div>`
  }</div>`;
}

function viewFollowup(){
  const all = followups(); const mine = S.fuMine && me();
  const items = mine ? all.filter(f=>f.n.owner===me()) : all;
  const groups = [["overdue","Overdue"],["today","Due today"],["soon","Coming up this week"]];
  const noConsent = S.newcomers.filter(n=>!n.consent).length;
  const dueNow = items.filter(f=>f.diff<=0 && !f.done && !(S.skip&&S.skip[f.n.id])); const nx = dueNow[0];
  const miss = missingPeople(), cel = celebrations(), pray = prayerList(14);
  const celSent = S.reminders["celebrate_"+today().slice(0,4)]||{};
  const dis = S.canWrite&&S.db?"":"disabled";
  return `
  <div><h2 class="view-title">Follow-up</h2><p class="view-sub">Welcome on Sunday evening, check in on Wednesday, invite back on Saturday for the 2 pm service.</p></div>
  <section class="section">
    <div class="grid2">
      <div class="field"><label for="senderName">Your name</label><input type="text" id="senderName" list="teamList" placeholder="e.g. Sam" value="${esc(S.sender)}"><datalist id="teamList">${S.team.map(t=>`<option value="${esc(t)}">`).join("")}</datalist><span class="hint">Shows who sent what, and fills {sender} in messages.</span></div>
      <div class="field"><span class="lbl">Show</span><div class="seg" role="group" aria-label="Whose follow-up"><button data-fumine="0" aria-pressed="${!S.fuMine}">Everyone’s</button><button data-fumine="1" aria-pressed="${S.fuMine}" ${me()?"":"disabled"}>Only mine</button></div>${S.fuMine&&me()&&!S.team.includes(me())?`<span class="hint" style="color:var(--warn)">${esc(me())} isn’t on the follow-up team yet, so nothing is assigned to you.</span>`:""}</div>
    </div>
    <details class="tpl" ${S.teamOpen?"open":""} id="teamDetails"><summary><span class="small" style="font-weight:600">Follow-up team (${S.team.length})</span><span class="small muted">${S.team.length?"New people are shared out between them":"Add names to share out new people"}</span></summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        ${S.team.length?`<div class="row" style="gap:6px">${S.team.map(t=>{ const c=S.newcomers.filter(n=>inBuffer(n)&&n.owner===t).length; return `<span class="chipx">${esc(t)} <span class="muted num">${c}</span><button class="mini" data-teamdel="${esc(t)}" aria-label="Remove ${esc(t)}" ${dis}>✕</button></span>`; }).join("")}</div>`:""}
        <div class="row" style="gap:6px"><input type="text" id="teamNew" placeholder="Add a name, e.g. Sister Vivian" style="flex:1;min-width:160px"><button class="btn" id="teamAdd" ${dis}>Add</button></div>
        ${S.team.length&&S.newcomers.some(n=>inBuffer(n)&&!n.owner)?`<button class="btn" id="shareOut" style="align-self:flex-start" ${dis}>Share out the ${S.newcomers.filter(n=>inBuffer(n)&&!n.owner).length} people with no one assigned</button>`:""}
      </div></details>
  </section>
  ${nx?`<section class="section sendnext"><div class="section-head"><h3>Send next</h3><span class="small muted num">${dueNow.length} due now</span></div>
    <div><b>${esc(nx.n.name)}</b> · ${esc(nx.st.label)}${nx.n.owner?` <span class="pill acc">${esc(nx.n.owner)}</span>`:""}</div>
    <div class="row"><a class="btn wa big" href="${esc(waLink(nx.n.phone,fillTpl(nx.st.key,nx.n)))}" target="_blank" rel="noopener" data-sendnext="${esc(nx.n.id)}|${nx.st.key}">Open WhatsApp and tick it</a><button class="btn" data-skipnext="${esc(nx.n.id)}">Skip for now</button></div>
    <span class="hint">Tap, send in WhatsApp, come back, tap again. Each one is ticked as sent${me()?" by "+esc(me()):""}.</span></section>`:""}
  <div class="group-label"><span class="label">Newcomer follow-up${mine?" · mine":""}</span></div>
  ${!S.loaded.n && S.db ? `<div class="empty">Loading…</div>` : items.length ? groups.map(([k,l])=>{
    const g = items.filter(i=>i.bucket===k); if(!g.length) return "";
    return `<div class="group-label"><span class="label">${l}</span><span class="count num">${g.length}</span></div>` + g.map(fuCard).join("");
  }).join("") : `<div class="list"><div class="empty"><b>All caught up</b>No follow-up messages are due in the next 7 days${mine?" for you":""}.</div></div>`}
  <section class="section"><div class="section-head"><h3>We miss you</h3><span class="small muted num">${miss.length}</span></div>
    <p class="small muted" style="margin:0">Regulars and members who have missed ${MISS_N} or more Sundays in a row (only Sundays where the roll call was taken count).</p>
    ${miss.length?`<div class="list">${miss.map(p=>`<div class="rem-row"><div class="avatar">${esc(initials(p.name))}</div><div class="main"><div class="name" style="font-weight:600">${esc(p.name)}</div><div class="small muted">${p.stage} · last came ${esc(fmt(p.last))} · missed ${p.k}</div></div>
      <a class="btn wa" href="${esc(waLink(p.phone,fillTpl("missed",{name:p.name})))}" target="_blank" rel="noopener">Send</a>
      <button class="btn" data-missed="${p.kind}|${esc(p.id)}" ${dis}>Reached out</button></div>`).join("")}</div>`:`<div class="list"><div class="empty">Nobody is missing right now.</div></div>`}
  </section>
  <section class="section"><div class="section-head"><h3>Birthdays & anniversaries this week</h3><span class="small muted num">${cel.length}</span></div>
    ${cel.length?`<div class="list">${cel.map(c=>{ const key=c.type+"|"+c.pid+"|"+c.date; const was=celSent[key]; return `<div class="rem-row ${was?"on":""}"><div class="avatar">${c.type==="birthday"?"🎂":"💍"}</div><div class="main"><div class="name" style="font-weight:600">${esc(c.name)}</div><div class="small muted">${c.type==="birthday"?"Birthday":"Wedding anniversary"} · ${c.date===today()?"<b>today</b>":esc(parse(c.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}))}</div></div>
      <a class="btn wa" href="${esc(waLink(c.phone,fillTpl(c.type,{name:c.name})))}" target="_blank" rel="noopener">Send</a>
      <label class="tickbox"><input type="checkbox" data-cel="${esc(key)}" ${was?"checked":""} ${dis}><span>Sent</span></label></div>`; }).join("")}</div>`:`<div class="list"><div class="empty">No birthdays or anniversaries in the next 7 days. Add them when you edit a member.</div></div>`}

function remDefault(){ const d=new Date(), wd=d.getDay(), h=d.getHours();
  if(wd===6) return ["service","service_sat"];
  if(wd===0) return h>=21?["mg","mg_eve"]:h>=17?["service","service_thanks"]:h>=14?["service","service_live"]:["service","service"];
  if(wd===2&&h>=12) return h>=19?["bible","bible_live"]:["bible","bible"];
  if(wd>=1&&wd<=5&&h<12) return ["mg","mg"];
  if(wd>=1&&wd<=4) return ["mg","mg_eve"];
  return ["service","service_sat"]; }
function remPeople(){ const seen=new Set(), out=[];
  for(const n of S.newcomers){ if(!n.consent||!n.phone||n.status==="inactive") continue; const k=n.phone; if(seen.has(k)) continue; seen.add(k); out.push({id:"n_"+n.id,name:n.name,phone:n.phone,kind:"Newcomer"}); }
  for(const m of S.members){ if(!m.phone) continue; const k=normPhone(m.phone); if(seen.has(k)) continue; seen.add(k); out.push({id:"m_"+m.id,name:m.name,phone:k,kind:"Member"}); }
  return out.sort((a,b)=>String(a.name).localeCompare(String(b.name))); }
async function markReminder(key,pid,val){

function monthReport(which){
  const t=parse(today()); if(which==="last"){ t.setDate(1); t.setMonth(t.getMonth()-1); } const ym=iso(t).slice(0,7);

  const inM=d=>(d||"").startsWith(ym);
  const pt=parse(ym+"-01"); pt.setMonth(pt.getMonth()-1); const pym=iso(pt).slice(0,7);
  const ncs=S.newcomers.filter(n=>inM(n.firstVisit)), prev=S.newcomers.filter(n=>(n.firstVisit||"").startsWith(pym)).length;
  const back=ncs.filter(n=>visitsOf(n).count>1||n.status==="returned"||n.status==="member").length;
  const newReg=S.newcomers.filter(n=>inM(n.regularSince)).length, newMem=S.newcomers.filter(n=>inM(n.memberSince)).length;
  const svcs=Object.values(S.services).filter(s=>inM(s.date)); const counts=svcs.map(s=>Math.max(headcount(s),(s.present||[]).length+(s.presentNc||[]).length)).filter(x=>x>0);
  const avg=counts.length?Math.round(counts.reduce((a,b)=>a+b,0)/counts.length):0;
  let due=0, sent=0; for(const n of S.newcomers){ if(!n.consent) continue; for(const st of STEPS){ const d=stepDue(n,st); if(inM(d)&&d<=today()){ due++; if((n.steps||{})[st.key]) sent++; } } }
  const pr=S.newcomers.reduce((a,n)=>a+Object.values(n.notesLog||{}).filter(x=>x&&x.prayer&&inM(String(x.at).slice(0,10))).length+(n.notes&&inM(n.firstVisit)?1:0),0);
  const gs=FELLOW.map(([k,l])=>`${l} ${S.members.filter(m=>memberFellow(m)===k).length+S.newcomers.filter(n=>inBuffer(n)&&fellowOf(n)===k).length}`).join(" · ");
  return `CPIC Shepherd report · ${name}

Newcomers: ${ncs.length}${which==="this"?" so far":""} (${prev} the month before)

Prayer requests recorded: ${pr}
Groups: ${gs}`;
}

/* ---------- writes ---------- */
function guard(){ if(!S.db){ toast("Sign in to save changes"); return false; } if(!S.canWrite){ toast("You have view-only access"); return false; } markDirty(); return true; }
function writeErr(e){
  const c = e && e.code;
  if(c==="invalid_argument"){ S.canWrite=false; S.readOnlyReason="Your access level does not allow changes. Ask the page owner for Contributor access."; render(); }
  else if(c==="quota_exceeded") toast("Storage is full. Export and remove old records first.");
  else toast("Could not save. Check your connection and try again.");
}
async function retry(fn){ try{ return await fn(); }catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*900)); return fn(); } throw e; } }

function queueService(date){
  if(!guard()) return;
  svcPending[date] = true;
  clearTimeout(queueService["t"+date]);
  queueService["t"+date] = setTimeout(()=>flushService(date), 700);
}
async function flushService(date){
  if(svcBusy[date]){ svcPending[date]=true; return; }
  svcBusy[date] = true; delete svcPending[date];
  const body = JSON.parse(JSON.stringify(svc(date)));
  try{ await retry(()=>S.db.collection("services").doc(date).set(body)); }
  catch(e){ writeErr(e); }
  svcBusy[date] = false;
  if(svcPending[date]) flushService(date);
}
function changeService(mut){
  if(!guard()) return;
  const s = JSON.parse(JSON.stringify(svc(S.date)));
  s.tallies = s.tallies || {men:0,women:0,youth:0,children:0}; s.present = s.present || []; s.presentNc = s.presentNc || [];
  mut(s); s.date = S.date; s.updatedAt = new Date().toISOString();
  S.services[S.date] = s; render(); queueService(S.date);
}

async function saveNewcomer(data){
  if(!guard()) return;
  try{
    if(S.editingId){
      await retry(()=>S.db.collection("newcomers").doc(S.editingId).update(data));
      toast("Changes saved");
    } else {
      const owner = nextOwner();
      const body = {...data, status:"new", owner, steps:{welcome:null,checkin:null,invite:null}, createdAt:new Date().toISOString(), createdBy:S.uid||null, log:logE("Registered"+(owner?" · follow-up by "+owner:""))};
      const ref = S.db.collection("newcomers").doc();
      await retry(()=>ref.set(body));
      toast(firstName(data.name)+" is registered."+(owner?" "+owner+" will follow up.":" Welcome message is ready under Follow-up."));
    }
    S.formOpen=false; S.editingId=null; S.dupWarn=null; S.dupOk=false; render();
  }catch(e){ writeErr(e); }
}
async function saveGroups(patch){ const ref=S.db.collection("settings").doc("groups"); try{ await retry(()=>ref.update(patch)); }catch(e){ if(e&&e.code==="invalid_argument") await retry(()=>ref.set(patch)); else throw e; } }
async function markGroupSent(g){ const list=grpPick(g,S.grpRange); if(!list.length||!guard()) return; const d=today();
  for(const n of list){ n.groupSent={...(n.groupSent||{}),[g]:d}; } render();
  try{ await Promise.all(list.map((n,i)=>retry(()=>S.db.collection("newcomers").doc(n.id).update({groupSent:{[g]:d}, log:logE("Sent to "+(S.pres[g].name||"the group president"),i)})))); toast(`${list.length} marked as sent to ${S.pres[g].name||"the president"}`); }catch(e){ writeErr(e); } }
function setStage(n,k,date,auto){
  const was=n.status||"new"; if(was===k) return; const patch={status:k, log:logE((auto?"Came back, so moved to ":"Moved to ")+STATUS[k][0])};
  if(k==="returned"&&!n.regularSince) patch.regularSince=date||today();
  if(k==="member") patch.memberSince=today();
  updateNc(n.id,patch);
  if(k==="member" && was!=="member" && S.db && S.canWrite && !S.members.some(m=>m.fromNewcomer===n.id)){
    S.db.collection("members").doc().set({name:n.name, phone:n.phone||"", group:fellowOf(n)==="youth"?"youth":n.gender==="Female"?"women":"men", fellowship:fellowOf(n)||"", birthday:n.birthday||"", fromNewcomer:n.id, createdAt:new Date().toISOString()})
      .then(()=>toast(firstName(n.name)+" is now a full member and in the members register")).catch(writeErr);
  } else if(k==="returned") toast(firstName(n.name)+(auto?" came back, so they’re now a Regular":" is now a Regular"));
}
function markStep(id,key,on){ const st=STEPS.find(s=>s.key===key);
  updateNc(id,{steps:{[key]:on?today():null}, stepsBy:{[key]:on?(me()||""):null}, log:logE((on?"Sent the ":"Unticked the ")+(st?st.label.toLowerCase():key))}); }
async function updateMember(id,patch){ if(!guard()) return; const m=S.members.find(x=>x.id===id); if(m) Object.assign(m,patch); render(); try{ await retry(()=>S.db.collection("members").doc(id).update(patch)); }catch(e){ writeErr(e); } }
async function saveTeam(names){ if(!guard()) return; S.team=names; render(); try{ await retry(()=>S.db.collection("settings").doc("team").set({names})); }catch(e){ writeErr(e); } }
async function markCelebrate(key,val){ if(!guard()) return; const id="celebrate_"+today().slice(0,4); const cur={...(S.reminders[id]||{})};
  if(val) cur[key]=new Date().toISOString(); else delete cur[key]; S.reminders[id]=cur; render();
  try{ await retry(()=>S.db.collection("reminders").doc(id).set({key:"celebrate",date:today().slice(0,4),sent:cur})); }catch(e){ writeErr(e); } }
async function updateNc(id, patch){
  if(!guard()) return;
  const n = S.newcomers.find(x=>x.id===id);
  if(n){ for(const [k,v] of Object.entries(patch)){ if(v && typeof v==="object" && !Array.isArray(v) && n[k] && typeof n[k]==="object") n[k]={...n[k],...v}; else n[k]=v; } }
  render();
  try{ await retry(()=>S.db.collection("newcomers").doc(id).update(patch)); }catch(e){ writeErr(e); }
}

/* ---------- CSV ---------- */
function csv(rows){ return rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n"); }
async function saveFile(name, text){
  try{
    const dl = await claude.use("downloads");
    if(!dl){ toast("Downloads are not available in this view"); return; }
    await dl.save({filename:name, data:text});
  }catch(e){ if(e && e.code!=="declined") toast("Could not export the file"); }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,a"); if(!t) { if(e.target.id==="scrim"){ S.sheetId=null; S.delArm=null; renderSheet(); } return; }
  if(t.dataset.tally){ const k=t.dataset.tally, d=Number(t.dataset.d); changeService(s=>{ s.tallies[k]=Math.max(0,(Number(s.tallies[k])||0)+d); }); return; }
  if(t.dataset.member){ const id=t.dataset.member; changeService(s=>{ const i=s.present.indexOf(id); if(i>=0) s.present.splice(i,1); else s.present.push(id); }); return; }
  if(t.dataset.ncp){ const id=t.dataset.ncp; const n=S.newcomers.find(x=>x.id===id); let on=false;
    changeService(s=>{ const i=s.presentNc.indexOf(id); if(i>=0) s.presentNc.splice(i,1); else { s.presentNc.push(id); on=true; } });
    if(on && n && (n.status||"new")==="new" && S.date>n.firstVisit) setStage(n,"returned",S.date,true);
    return; }
  if(t.dataset.medit){ S.memberEditId=t.dataset.medit; S.memberFormOpen=true; S.mDelArm=false; render(); setTimeout(()=>{ const f=$("memberForm"); f&&f.scrollIntoView({block:"center"}); },0); return; }
  if(t.id==="cancelMember"){ S.memberEditId=null; S.memberFormOpen=false; render(); return; }
  if(t.id==="delMember"){ if(!S.mDelArm){ S.mDelArm=true; render(); setTimeout(()=>{ S.mDelArm=false; if(S.memberEditId) render(); },4000); return; }
    if(!guard()) return; const id=S.memberEditId; S.memberEditId=null; S.memberFormOpen=false; S.mDelArm=false; S.members=S.members.filter(m=>m.id!==id); render();
    retry(()=>S.db.collection("members").doc(id).delete()).then(()=>toast("Member removed")).catch(writeErr); return; }
  if(t.id==="prevSun"){ S.date = isSunday(S.date) ? addDays(S.date,-7) : lastSunday(S.date); S.spForm=false; render(); return; }
  if(t.id==="nextSun"){ const n=addDays(lastSunday(S.date),7); if(n<=today()){ S.date=n; S.spForm=false; render(); } return; }
  if(t.id==="spOpen"){ S.spForm=true; render(); setTimeout(()=>$("spName")&&$("spName").focus(),0); return; }
  if(t.id==="spCancel"){ S.spForm=false; render(); return; }
  if(t.id==="spGo"){ const d=$("spDate").value, nm=$("spName").value.trim(); if(!d){ toast("Pick the date first"); return; } if(d>today()){ toast("That date is in the future"); return; }
    S.spForm=false; S.date=d; if(isSunday(d)&&!nm){ render(); return; } changeService(s=>{ s.label=nm||(isSunday(d)?"Sunday Service":"Special service"); }); toast("Recording "+(nm||"the service")+" on "+fmt(d)); return; }
  if(t.id==="toggleMemberForm"){ if(S.memberEditId){ S.memberEditId=null; S.memberFormOpen=true; } else S.memberFormOpen=!S.memberFormOpen; render(); if(S.memberFormOpen) setTimeout(()=>$("mName")&&$("mName").focus(),0); return; }
  if(t.id==="dupSave"){ S.dupOk=true; S.dupWarn=null; const f=$("ncForm"); if(f) f.requestSubmit(); return; }
  if(t.dataset.sendnext){ const [id,key]=t.dataset.sendnext.split("|"); setTimeout(()=>{ const n=S.newcomers.find(x=>x.id===id); if(n&&!(n.steps||{})[key]){ markStep(id,key,true); toast("Ticked. Send the next one when you’re back."); } },500); return; }
  if(t.dataset.skipnext){ S.skip=S.skip||{}; S.skip[t.dataset.skipnext]=true; render(); return; }
  if(t.dataset.fumine){ S.fuMine=t.dataset.fumine==="1"; lsSet("cpic.mine",S.fuMine?"1":"0"); render(); return; }

  if(t.id==="shareOut"){ if(!guard()) return; const free=S.newcomers.filter(n=>inBuffer(n)&&!n.owner); free.forEach(n=>{ const o=nextOwner(); n.owner=o; updateNc(n.id,{owner:o, log:logE("Assigned to "+o)}); }); toast(free.length+" shared out between the team"); return; }
  if(t.dataset.missed){ const [kind,id]=t.dataset.missed.split("|"); if(kind==="nc") updateNc(id,{missedSent:today(), log:logE("Reached out after missing Sundays")}); else updateMember(id,{missedSent:today()}); toast("Marked as reached out"); return; }

  if(t.dataset.rep){ S.repMonth=t.dataset.rep; render(); return; }
  if(t.id==="copyReport"){ const txt=monthReport(S.repMonth); try{ navigator.clipboard.writeText(txt).then(()=>toast("Report copied"),()=>toast("Copy blocked here. Select the text and copy it.")); }catch(_){ toast("Copy blocked here."); } return; }
  if(t.id==="openForm"){ if(S.formOpen && !S.editingId){ S.formOpen=false; } else { S.formOpen=true; S.editingId=null; } render(); if(S.formOpen) setTimeout(()=>$("fName")&&$("fName").focus(),0); return; }
  if(t.id==="cancelForm"){ S.formOpen=false; S.editingId=null; S.dupWarn=null; S.dupOk=false; render(); return; }
  if(t.dataset.filter){ S.ncFilter=t.dataset.filter; render(); return; }
  if(t.dataset.grp){ S.grp=t.dataset.grp; S.presEdit=false; render(); return; }
  if(t.dataset.grange){ S.grpRange=t.dataset.grange; render(); return; }
  if(t.id==="presEditBtn"||t.id==="presEditBtn2"){ S.presEdit=true; render(); setTimeout(()=>$("pPhone")&&$("pPhone").focus(),0); return; }
  if(t.id==="presCancel"){ S.presEdit=false; render(); return; }
  if(t.dataset.gsend){ const g=t.dataset.gsend; setTimeout(()=>markGroupSent(g),400); return; }
  if(t.dataset.gmark){ markGroupSent(t.dataset.gmark); return; }
  if(t.dataset.nc){ S.sheetId=t.dataset.nc; S.delArm=null; renderSheet(); setTimeout(()=>$("closeSheet")&&$("closeSheet").focus(),0); return; }
  if(t.id==="closeSheet"){ S.sheetId=null; S.delArm=null; renderSheet(); return; }
  if(t.dataset.toggleStep){ const n=S.newcomers.find(x=>x.id===S.sheetId); if(!n) return; const k=t.dataset.toggleStep; markStep(n.id,k,!(n.steps||{})[k]); return; }
  if(t.dataset.status){ const n=S.newcomers.find(x=>x.id===S.sheetId); if(n) setStage(n,t.dataset.status); return; }
  if(t.dataset.stage){ const [id,k]=t.dataset.stage.split("|"); const n=S.newcomers.find(x=>x.id===id); if(!n) return;
    if(k==="member"&&n.firstVisit&&daysBetween(n.firstVisit,today())<BUFFER_DAYS&&t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="Under 3 months. Tap again"; setTimeout(()=>{ if(t.isConnected){ t.dataset.armed=""; t.textContent=STAGE_NEXT.returned[1]; } },4000); return; }
    setStage(n,k); return; }
  if(t.id==="editNc"){ S.editingId=S.sheetId; S.formOpen=true; S.sheetId=null; location.hash="newcomers"; S.view="newcomers"; render(); setTimeout(()=>{ const w=$("ncFormWrap"); w&&w.scrollIntoView({block:"start"}); },0); return; }
  if(t.id==="delNc"){
    if(S.delArm!==S.sheetId){ S.delArm=S.sheetId; renderSheet(); setTimeout(()=>{ if(S.delArm){ S.delArm=null; renderSheet(); } },4000); return; }
    if(!guard()) return; const id=S.sheetId; S.sheetId=null; S.delArm=null;
    S.newcomers = S.newcomers.filter(n=>n.id!==id); render();
    retry(()=>S.db.collection("newcomers").doc(id).delete()).then(()=>toast("Record deleted")).catch(writeErr); return; }
  if(t.dataset.copy || t.dataset.sent){
    const [id,key] = (t.dataset.copy||t.dataset.sent).split("|"); const n=S.newcomers.find(x=>x.id===id); if(!n) return;
    if(t.dataset.copy){ const msg=fillTpl(key,n);
      try{ navigator.clipboard.writeText(msg).then(()=>toast("Message copied"),()=>toast("Copy blocked here. Long-press the message to copy it.")); }catch(_){ toast("Copy blocked here. Long-press the message to copy it."); }
    } else {
      if(n.steps&&n.steps[key]) return;   /* already marked: a double tap does nothing */
      delete OPENED[id+"|"+key]; JUST[id]={key,t:Date.now()}; markStep(id,key,true);
      setTimeout(()=>{ if(JUST[id]&&Date.now()-JUST[id].t>=11900){ delete JUST[id]; if(S.view==="follow-up") render(); } },12000);
    }
    return; }
  if(t.dataset.open){ OPENED[t.dataset.open]=true; setTimeout(render,400); return; }
  if(t.dataset.notyet){ delete OPENED[t.dataset.notyet]; render(); return; }
  if(t.dataset.undo){ const [id,key]=t.dataset.undo.split("|"); delete JUST[id]; markStep(id,key,false); toast("Undone. It’s back on the list."); return; }
  if(t.dataset.rsend){ const [key,pid]=t.dataset.rsend.split("|"); OPENED["r|"+key+"|"+pid]=true; setTimeout(render,400); return; }
  if(t.dataset.rdone){ const [key,pid]=t.dataset.rdone.split("|"); markReminder(key,pid,true); return; }
  if(t.dataset.rundo){ const [key,pid]=t.dataset.rundo.split("|"); markReminder(key,pid,false); return; }
  if(t.dataset.rkey){ S.remKey=t.dataset.rkey; S.remMsg=null; render(); return; }
  if(t.dataset.rmsg){ S.remMsg=t.dataset.rmsg; render(); return; }
  if(t.dataset.rcopy){ const msg=fillTpl(t.dataset.rcopy,{name:"everyone"}); try{ navigator.clipboard.writeText(msg).then(()=>toast("Message copied for a broadcast list or Status"),()=>toast("Copy blocked here.")); }catch(_){ toast("Copy blocked here."); } return; }
  if(t.id==="resetTpl"){ TPL_KEYS.forEach(k=>{ const el=$("tpl_"+k); if(el) el.value=DEFAULT_TPL[k]; }); toast("Defaults restored. Save to apply."); return; }
  if(t.id==="pubNow"){ publishCopy(true); return; }
  if(t.id==="csvNc"){
    const rows=[["Name","WhatsApp","Gender","Nationality","Visa status","Work","Occupation","Lives in","Invited by","First visit","Stage","Times came","Group","Followed up by","Birthday","Contact OK","Welcome sent","Check-in sent","Invite sent","Notes"]];
    S.newcomers.slice().sort((a,b)=>(a.firstVisit||"").localeCompare(b.firstVisit||"")).forEach(n=>{ const s=n.steps||{}; rows.push([n.name,n.phone,n.gender,n.nationality,n.visa,n.work,n.occupation,n.area,n.invitedBy,n.firstVisit,(STATUS[n.status||"new"]||STATUS.new)[0],visitsOf(n).count,FNAME[fellowOf(n)]||"",n.owner||"",fmtDM(n.birthday),n.consent?"Yes":"No",s.welcome||"",s.checkin||"",s.invite||"",n.notes]); });
    saveFile("cpic-newcomers-"+today()+".csv", csv(rows)); return; }
  if(t.id==="csvAtt"){
    const rows=[["Date","Service","Men","Women","Youth","Children","Headcount","Members ticked","Newcomers & Regulars ticked","Newcomers registered"]];
    Object.values(S.services).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{ const tl=s.tallies||{}; rows.push([s.date,s.label,tl.men||0,tl.women||0,tl.youth||0,tl.children||0,headcount(s),(s.present||[]).length,(s.presentNc||[]).length,S.newcomers.filter(n=>n.firstVisit===s.date).length]); });
    saveFile("cpic-attendance-"+today()+".csv", csv(rows)); return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="teamNew"){ e.preventDefault(); $("teamAdd")&&$("teamAdd").click(); return; } if(e.key==="Escape" && S.sheetId){ S.sheetId=null; S.delArm=null; renderSheet(); } });
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="memberSearch"){ S.memberQuery=t.value; render(); }
  else if(t.id==="ncSearch"){ S.ncQuery=t.value; render(); }
  else if(t.id==="senderName"){ S.sender=t.value; lsSet("cpic.sender",t.value); clearTimeout(S._st); S._st=setTimeout(render,700); }
  else if(t.id==="grpMsg"){ S.grpMsg[t.dataset.mk]=t.value; const a=$("grpSend"); const p=S.pres[S.grp]; if(a&&p&&p.phone) a.href=waLink(p.phone,t.value); }
});
document.addEventListener("toggle", e=>{ const d=e.target; if(d.classList&&d.classList.contains("sun")){ S.sunClosed=S.sunClosed||{}; S.sunClosed[d.dataset.sun]=!d.open; } }, true);
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.tick){ const [id,key]=t.dataset.tick.split("|"); const n=S.newcomers.find(x=>x.id===id); if(!n) return;
    if(t.checked){ const cur=followups().find(f=>f.n.id===id&&!f.done); if(cur&&cur.st.key===key) JUST[id]={key,t:Date.now()};
      markStep(id,key,true); setTimeout(()=>{ if(JUST[id]&&Date.now()-JUST[id].t>=7900){ delete JUST[id]; if(S.view==="follow-up") render(); } },8000); }
    else { if(JUST[id]&&JUST[id].key===key) delete JUST[id]; markStep(id,key,false); }
    return; }
  if(t.dataset.fel){ if(t.value){ updateNc(t.dataset.fel,{fellowship:t.value, log:logE("Moved to the "+FNAME[t.value])}); toast("Moved to "+FNAME[t.value]); } return; }
  if(t.dataset.owner){ const o=t.value; updateNc(t.dataset.owner,{owner:o, log:logE(o?"Assigned to "+o:"Unassigned")}); toast(o?o+" will follow up":"No one assigned"); return; }
  if(t.dataset.cel){ markCelebrate(t.dataset.cel,t.checked); return; }
  if(t.id==="svcLabel"){ const v=t.value.trim(); changeService(s=>{ s.label=v||"Special service"; }); return; }
  if(t.dataset.mfel){ if(!guard()) return; const m=S.members.find(x=>x.id===t.dataset.mfel); if(m){ m.fellowship=t.value; render(); } retry(()=>S.db.collection("members").doc(t.dataset.mfel).update({fellowship:t.value})).then(()=>toast("Moved to "+FNAME[t.value])).catch(writeErr); return; }
  if(t.dataset.rtick){ const [key,pid]=t.dataset.rtick.split("|"); markReminder(key,pid,t.checked); return; }
  if(t.id==="pubVisa"){ PUB.visa=t.checked; markDirty(); PUB.lastWrite=0; toast(t.checked?"Visa status will show in the public copy":"Visa status is hidden from people who aren’t signed in"); return; }
  if(t.id==="svcDate" && t.value){
    if(!isSunday(t.value) && S.services[t.value]){ S.date=t.value; render(); return; }
    let d = lastSunday(t.value); const max = lastSunday(today()); if(d>max) d=max;
    if(d!==t.value) toast("Services are on Sundays, so this shows "+fmt(d));
    S.date=d; render();
  }
});
document.addEventListener("toggle", e=>{ if(e.target.id==="tplDetails") S.tplOpen=e.target.open; if(e.target.id==="teamDetails") S.teamOpen=e.target.open; }, true);
document.addEventListener("submit", e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="ncForm"){
    const name=$("fName").value.trim(); if(!name){ toast("Add their name first"); return; }
    const cc=$("fCC").value; lsSet("cpic.cc",cc); const phone=normPhone($("fPhone").value,cc);
    if(!S.dupOk){ const d=findDup(name,phone,S.editingId); if(d && !(S.editingId)){ S.dupWarn=d; render(); return; } }
    saveNewcomer({ name, phone, birthday:readDM("fBday"), gender:$("fGender").value, nationality:$("fNation").value.trim(), visa:$("fVisa").value, work:$("fWork").value,
      occupation:$("fOcc").value.trim(), area:$("fArea").value.trim(), invitedBy:$("fInvited").value.trim(), firstVisit:$("fFirst").value||today(), notes:$("fNotes").value.trim(), consent:$("fConsent").checked, fellowship:$("fFellow").value });
  } else if(f.id==="memberForm"){
    if(!guard()) return; const name=$("mName").value.trim(); if(!name) return;
    const body={name, phone:normPhone($("mPhone").value,$("mCC").value), group:$("mGroup").value, birthday:readDM("mBday"), anniversary:readDM("mAnniv")};
    if(S.memberEditId){ const id=S.memberEditId; S.memberEditId=null; S.memberFormOpen=false; updateMember(id,body); toast("Saved"); return; }
    body.createdAt=new Date().toISOString();
    retry(()=>S.db.collection("members").doc().set(body)).then(()=>{ toast(firstName(name)+" added"); S.memberFormOpen=false; render(); }).catch(writeErr);
  } else if(f.id==="presForm"){
    if(!guard()) return; const g=f.dataset.k; const val={name:$("pName").value.trim()||DEFAULT_PRES[g].name, phone:normPhone($("pPhone").value)};
    S.pres[g]=val; S.presEdit=false; render(); saveGroups({presidents:{[g]:val}}).then(()=>toast("Saved for the whole team")).catch(writeErr);
  } else if(f.id==="tplForm"){
    if(!guard()) return; const body={}; TPL_KEYS.forEach(k=>body[k]=$("tpl_"+k).value.trim()||DEFAULT_TPL[k]);
    S.templates=body; S.tplSaved=body; retry(()=>S.db.collection("settings").doc("templates").set(body)).then(()=>{ toast("Templates saved for the whole team"); render(); }).catch(writeErr);
  }
});

/* ---------- routing ---------- */
const VIEWS=["sunday","newcomers","follow-up","groups","insights"];
function route(){ const h=location.hash.replace("#",""); S.view = VIEWS.includes(h)?h:"sunday"; S.sheetId=null; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", route);

/* ---------- sync status ---------- */
function setSync(){
  const dot=$("syncDot"), txt=$("syncText");
  if(!S.db){ dot.className="dot"; txt.textContent=SNAP?"Saved "+fmtWhen(SNAP.at):"Offline copy"; return; }
  const all = S.loaded.n && S.loaded.m && S.loaded.s;
  if(all && !S.stale){ dot.className="dot on"; txt.textContent="Live"; }
  else { dot.className="dot wait"; txt.textContent = S.stale?"Reconnecting":"Connecting"; }
}

/* ---------- boot ---------- */
async function boot(){
  route(); setSync();
  if(!window.claude || !claude.use){ S.db=null; render(); setSync(); return; }
  let db=null, user=null;
  let art=null;
  try{ [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);   /* the shared no-sign-in copy is switched off: the page stays invite-only */ }catch(_){}
  PUB.art=art;
  S.db = db;
  /* only people the page is shared with for editing (the invited workers) can open the records */
  if(user && typeof user.canEdit==="function"){ let ok=true; try{ ok = await user.canEdit(); }catch(_){} if(!ok){ S.locked=true; S.db=null; render(); setSync(); return; } }
  if(user){ try{ S.uid = await user.id(); }catch(_){} try{ const c = await user.can("data.write"); if(c===false){ S.canWrite=false; S.readOnlyReason="Ask the page owner for Contributor access so you can record newcomers and attendance."; } }catch(_){} }
  if(!db){ render(); setSync(); return; }
  const timer = setTimeout(()=>{ S.stale=true; S.loaded={n:true,m:true,s:true}; render(); setSync(); }, 10000);
  const done = k => { S.loaded[k]=true; if(S.loaded.n&&S.loaded.m&&S.loaded.s){ clearTimeout(timer); S.stale=false; } setSync(); };
  const onErr = k => e => { done(k); if(e && e.code==="revoked"){ S.db=null; } render(); setSync(); };
  db.collection("newcomers").onSnapshot(snap=>{
    S.newcomers = snap.docs.map(d=>({id:d.id, ...JSON.parse(JSON.stringify(d.data()||{}))}));
    if(!snap.metadata.fromCache) done("n"); render();
  }, onErr("n"));
  db.collection("members").onSnapshot(snap=>{
    S.members = snap.docs.map(d=>({id:d.id, ...(d.data()||{})}));
    if(!snap.metadata.fromCache) done("m"); render();
  }, onErr("m"));
  db.collection("services").onSnapshot(snap=>{
    for(const d of snap.docs){ if(svcPending[d.id] || svcBusy[d.id]) continue; S.services[d.id] = JSON.parse(JSON.stringify({...d.data(), date:d.id})); }
    if(!snap.metadata.fromCache) done("s"); render();
  }, onErr("s"));
  db.collection("reminders").onSnapshot(snap=>{ for(const d of snap.docs){ const v=d.data()||{}; S.reminders[d.id]=v.sent||{}; } if(S.view==="follow-up") render(); }, ()=>{});
  db.doc("settings/groups").onSnapshot(d=>{ const v=d.exists?(d.data()||{}):{}; const pr=v.presidents||{}; for(const [k] of FELLOW) S.pres[k]={...DEFAULT_PRES[k],...(pr[k]||{})}; if(S.view==="groups"&&!S.presEdit) render(); }, ()=>{});
  db.doc("settings/team").onSnapshot(d=>{ const v=d.exists?(d.data()||{}):{}; S.team=Array.isArray(v.names)?v.names.filter(x=>typeof x==="string"):[]; render(); }, ()=>{});
  db.doc("settings/templates").onSnapshot(d=>{ S.tplSaved = d.exists ? {...d.data()} : {}; S.templates = {...DEFAULT_TPL, ...S.tplSaved}; render(); }, ()=>{});
}
boot();
})();
</script>
