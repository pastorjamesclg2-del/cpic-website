<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPIC Poster Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a brief on the left built in six short steps, a live summary that follows you on the right; the queue below is where finished posters come back. */
:root{
  --navy:#1c287b; --red:#ed2023; --accent:#cc1a1d; --ink:#1a1c22; --muted:#4b4f5c; --line:#d5d8e6;
  --bg:#f5f6fb; --panel:#ffffff; --tint:#e9ebf5; --ok:#1f7a4d; --warn:#9a5b00; --bad:#b3261e;
  --on-navy:#ffffff;
  --font-display:Montserrat,"Arial Black",Arial,sans-serif; --font-body:"Open Sans",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --navy:#c9cfee; --red:#ff5a5c; --accent:#ff6b6d; --ink:#e9ebf5; --muted:#b4b9d2; --line:#2d3566;
  --bg:#0e1438; --panel:#161d4a; --tint:#1e2659; --ok:#5fd39a; --warn:#f2b24c; --bad:#ff8a80; --on-navy:#0e1438; color-scheme:dark; } }
:root[data-theme="dark"]{
  --navy:#c9cfee; --red:#ff5a5c; --accent:#ff6b6d; --ink:#e9ebf5; --muted:#b4b9d2; --line:#2d3566;
  --bg:#0e1438; --panel:#161d4a; --tint:#1e2659; --ok:#5fd39a; --warn:#f2b24c; --bad:#ff8a80; --on-navy:#0e1438; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-body)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);color:var(--navy);margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{height:34px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.01em}
.brand small{display:block;font:600 12px/1.2 var(--font-body);color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font:700 13px var(--font-display);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}
.tab .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
main{padding:24px 0 64px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:14px}
.steps{display:grid;gap:16px}
.step-h{display:flex;align-items:baseline;gap:12px}
.step-h .num{font:800 12px var(--font-display);color:#fff;background:var(--red);border-radius:4px;padding:2px 7px}
.step-h h2{font-size:18px}
.step-h p{margin:0 0 0 auto;color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
label.f{display:grid;gap:5px;font:600 13px var(--font-body);color:var(--muted)}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 11px;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font:700 13px var(--font-display);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.toggle{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--tint);cursor:pointer}
.toggle input{margin-top:3px;width:18px;height:18px;accent-color:var(--navy)}
.toggle b{display:block;color:var(--ink)}
.toggle span{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:0}
.btn{border:0;border-radius:6px;padding:10px 16px;font:700 14px var(--font-display);cursor:pointer;background:var(--navy);color:var(--on-navy);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.small{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* photos */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.person{position:relative;border:2px solid var(--line);border-radius:8px;background:repeating-conic-gradient(var(--tint) 0 25%,var(--panel) 0 50%) 0 0/14px 14px;cursor:pointer;padding:0;overflow:hidden;text-align:left}
.person img{aspect-ratio:1;object-fit:contain;width:100%}
.person span{display:block;font:700 12px var(--font-display);padding:6px 8px;background:var(--panel);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person[aria-pressed="true"]{border-color:var(--red)}
.person[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:800 13px/22px var(--font-display);text-align:center}
.add{border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;padding:12px;cursor:pointer;color:var(--muted);font:700 13px var(--font-display);min-height:140px;background:transparent}
.add input{display:none}
/* styles */
.style-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.style-tools input{flex:1 1 180px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.sty{border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:0;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sty svg{width:100%;height:auto;display:block;aspect-ratio:16/10}
.sty .t{padding:8px 10px 10px;display:grid;gap:2px}
.sty b{font:800 13px var(--font-display);color:var(--ink)}
.sty small{color:var(--muted);font-size:12px;line-height:1.35}
.sty[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.sty .pick{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:800 13px/24px var(--font-display);text-align:center}
.sty .sug{position:absolute;top:6px;right:6px;background:#fff;color:#1c287b;font:800 10px var(--font-display);padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.group-h{grid-column:1/-1;font:800 12px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.detail{background:var(--tint);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.detail h3{font-size:15px}
.detail p{margin:0;font-size:13px}
/* inspiration */
.insp{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:start}
@media (max-width:520px){.insp{grid-template-columns:1fr}}
.insp-img{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--tint)}
/* formats */
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fmt{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;cursor:pointer;display:grid;gap:8px;justify-items:center;text-align:center}
.fmt .bw{height:42px;display:grid;place-items:center}
.fmt .box{background:var(--tint);border:2px solid var(--muted);border-radius:3px}
.fmt b{font:800 13px var(--font-display)}
.fmt small{color:var(--muted);font-size:12px;line-height:1.3}
.fmt[aria-pressed="true"]{border-color:var(--red)}
.fmt[aria-pressed="true"] .box{background:var(--red);border-color:var(--red)}
/* summary */
aside.sum{position:sticky;top:84px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:980px){aside.sum{position:static}}
.sum-h{background:var(--navy);color:var(--on-navy);padding:16px 18px}
.sum-h h2{color:inherit;font-size:16px}
.sum-h p{margin:4px 0 0;font-size:13px;opacity:.85}
.sum-b{padding:16px 18px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.count{font:800 28px var(--font-display);color:var(--navy);font-variant-numeric:tabular-nums}
details.prompt summary{cursor:pointer;font:700 13px var(--font-display);color:var(--navy)}
details.prompt pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:260px;overflow:auto;margin:8px 0 0}
.missing{color:var(--warn);font-size:13px;margin:0}
/* queue */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.how b{font:800 13px var(--font-display);color:var(--navy);display:block;margin-bottom:4px}
.how p{margin:0;font-size:13px;color:var(--muted)}
.say{display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--on-navy);border-radius:10px;padding:14px 16px;margin-bottom:20px;flex-wrap:wrap}
.say q{font:800 18px var(--font-display);quotes:"\201C" "\201D"}
.say span{opacity:.85;font-size:13px;flex:1 1 220px}
.say .btn{background:var(--on-navy);color:var(--navy)}
.jobs{display:grid;gap:16px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:12px;border-left:5px solid var(--line)}
.job[data-st="queued"],.job[data-st="changes"]{border-left-color:var(--warn)}
.job[data-st="working"]{border-left-color:var(--navy)}
.job[data-st="done"]{border-left-color:var(--ok)}
.job[data-st="failed"]{border-left-color:var(--bad)}
.job-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.job-h h3{font-size:17px;margin-right:auto}
.job-h .meta{color:var(--muted);font-size:13px;width:100%}
.pill{font:800 11px var(--font-display);text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:var(--tint);color:var(--muted)}
.pill.queued,.pill.changes{background:#fff1d6;color:#7a4700}
.pill.working{background:#dfe3fb;color:#1c287b}
.pill.done{background:#d9f2e4;color:#145a37}
.pill.failed{background:#fde0de;color:#8c1d16}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.res{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:grid}
.res img{width:100%;background:var(--tint)}
.res .rb{padding:10px 12px;display:grid;gap:8px}
.res .rb b{font:800 12px var(--font-display)}
.res .acts{display:flex;gap:6px;flex-wrap:wrap}
.check{font-size:12px;border-radius:6px;padding:8px 10px;background:var(--tint)}
.check.ok{background:#d9f2e4;color:#145a37}
.check.fix{background:#fff1d6;color:#5c3700}
.check ul{margin:4px 0 0;padding-left:18px}
.log{font-size:12px;color:var(--muted);margin:0;padding-left:18px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.old{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.old figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.old figcaption{padding:6px 8px;font:700 12px var(--font-display);display:flex;justify-content:space-between;gap:6px;align-items:center}
.mbar{display:none}
@media (max-width:980px){header.top{position:static}.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}main{padding-bottom:96px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:600 14px var(--font-body);z-index:50;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--panel);border-radius:12px;max-width:460px;width:100%;padding:20px;display:grid;gap:12px}
.offline{background:#fff1d6;color:#5c3700;border-radius:8px;padding:10px 14px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  { id: "illustrated", name: "Illustrated", group: "art",

  { id: "isometric", name: "Isometric", group: "art",
    blurb: "Flat 3D blocks drawn at an angle.",

    recipe: "Isometric illustration: a tidy miniature world of flat 3D blocks drawn at a 30-degree angle (a small church building, stage, chairs, screens or a city block related to the event), soft shading on three faces, a clean pastel palette with one accent. Title in clean geometric sans-serif. Clear, clever and organised.",
    photo: "Place the speaker as a clean photo cut-out standing on one isometric platform, scaled sensibly.",
    art: '<rect width="160" height="100" fill="#e8f0ff"/><polygon points="80,18 116,38 80,58 44,38" fill="#9db8ff"/><polygon points="44,38 80,58 80,90 44,70" fill="#4e6fd6"/><polygon points="116,38 80,58 80,90 116,70" fill="#6f8fee"/><polygon points="80,30 94,38 80,46 66,38" fill="#ed2023"/>' }
];
const STYLE_BY_ID = Object.fromEntries(STYLES.map(s => [s.id, s]));

</script>
<script>
/* ---------- state ---------- */
const FORMATS = [
  {id:"16:9", name:"Wide 16:9", use:"YouTube, screens, Facebook", w:40, h:22.5},
  {id:"1:1", name:"Square 1:1", use:"Instagram feed, WhatsApp", w:30, h:30},
  {id:"4:5", name:"Portrait 4:5", use:"Instagram portrait", w:28, h:35},
  {id:"9:16", name:"Story 9:16", use:"Stories, Status, TikTok", w:22.5, h:40}
];
const KINDS = [["sermon","Sermon"],["series","Sermon series"],["event","Event"],["conference","Conference"],["announcement","Announcement"],["celebration","Celebration"]];
function lastSunday(){ const d=new Date(); d.setDate(d.getDate()-d.getDay()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const S = {
  page:"make", db:null, assets:null, dl:null, sample:null, imgOK:false, ready:false, canEdit:true,
  people:[], jobs:[], old:[], filter:"all", q:"", suggest:{}, busy:{}, checks:{}, changeFor:null,
  form:{ kind:"sermon", fromEkk:true, sermonDate:lastSunday(), title:"", subtitle:"", scripture:"", speaker:"Pastor James", details:"", extra:"",
    photos:[], styles:["bold-sermon"], insp:null, inspMode:"loose", formats:["16:9"], logo:true, notes:"" }
};
try{ const saved=JSON.parse(localStorage.getItem("cpic-ps-form")||"null"); if(saved&&saved.styles) Object.assign(S.form, saved, {sermonDate: saved.fromEkk? lastSunday(): saved.sermonDate}); }catch(_){}
function keep(){ try{ localStorage.setItem("cpic-ps-form", JSON.stringify(S.form)); }catch(_){} }
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }
const blob=id=>"/_blob/"+id;
const fmtDate=s=>{ try{ return new Date(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }catch(_){ return s; } };
const kindName=k=>(KINDS.find(x=>x[0]===k)||[,k])[1];

/* ---------- the Gemini prompt ---------- */
function textLines(f){
  const L=[];
  const title = f.title.trim() || (f.kind==="sermon"&&f.fromEkk ? `[the sermon title from Ekklesia for ${f.sermonDate}]` : "");
  if(title) L.push(["Main title", title]);
  if(f.subtitle.trim()) L.push(["Subtitle", f.subtitle.trim()]);
  if(f.scripture.trim()) L.push(["Scripture", f.scripture.trim()]);
  if(f.speaker.trim()) L.push(["Speaker", f.speaker.trim().toUpperCase()]);
  if(f.details.trim()) L.push(["Date, time and place", f.details.trim()]);
  if(f.extra.trim()) L.push(["Extra line", f.extra.trim()]);
  return L;
}
function formatTips(id){
  return {"16:9":"Wide landscape. Put the speaker on one side and the words on the other, with the title large enough to read on a phone thumbnail.",
    "1:1":"Square. Keep the title in the upper or middle third and the speaker large; keep 6% clear margins on every side.",
    "4:5":"Portrait 4:5. Stack the title above or beside the speaker; keep 6% clear margins.",
    "9:16":"Tall story 9:16. Keep all words out of the top 13% and bottom 13% (app buttons cover them); stack the title in the middle band."}[id];
}
function buildPrompt(f, styleId, fmt){
  const st=STYLE_BY_ID[styleId]; const names=f.photos.map(p=>p.name).filter(Boolean);
  const lines=textLines(f);
  const parts=[];
  parts.push(`Create a ${fmt} poster for a ${kindName(f.kind).toLowerCase()} at Christ Power International Church (CPIC), Dubai.`);
  parts.push(`STYLE: ${st.name}. ${st.recipe}`);
  if(f.insp) parts.push(f.inspMode==="close"
    ? "INSPIRATION: Follow the attached inspiration image closely for layout, colour and type treatment, blended with the style above. Do not copy any of its text, names, people or logos."
    : "INSPIRATION: Take only the mood and colour feeling from the attached inspiration image. Do not copy its layout, text, names, people or logos.");
  if(f.photos.length) parts.push(`PHOTO: Use the attached photo${f.photos.length>1?"s":""}${names.length?` of ${names.join(" and ")}`:""} as the main subject. ${st.photo} ${KEEP_FACE} Do not redraw, beautify, age or change the person. Remove any logos, watermarks or text that are in the photo.`);
  else parts.push("PHOTO: No people. Build the design from type, shapes and the style's imagery.");
  if(lines.length) parts.push("TEXT: Spell every word exactly as written below, and add no other words, dates or names:\n"+lines.map(([k,v])=>`- ${k}: "${v}"`).join("\n")+"\nThe main title is by far the largest text.");
  parts.push(f.logo ? "LOGO: Do not draw any church name, emblem or logo. Leave a clear, calm area in the top-right corner (about 20% of the width) where the real CPIC logo will be added afterwards." : "LOGO: Do not draw any church name, emblem or logo.");
  parts.push(`LAYOUT: ${formatTips(fmt)}`);
  parts.push("QUALITY: Crisp and print-ready, strong hierarchy, high-contrast readable text, nothing cut off at the edges, no watermarks.");
  if(f.notes.trim()) parts.push(`ALSO: ${f.notes.trim()}`);
  return parts.join("\n\n");
}
function combos(f){ const out=[]; for(const s of f.styles) for(const m of f.formats) out.push({style:s, format:m}); return out; }
function problems(f){
  const p=[];
  if(!(f.title.trim() || (f.kind==="sermon"&&f.fromEkk))) p.push("Add a title, or turn on “Get the title from Ekklesia”.");
  if(!f.styles.length) p.push("Pick at least one style.");
  if(!f.formats.length) p.push("Pick at least one size.");
  return p;
}

/* ---------- render ---------- */
function renderTabs(){
  const open=S.jobs.filter(j=>["queued","changes","working"].includes(j.status)).length;
  $("#tabs").innerHTML=`<button class="tab" role="tab" data-go="make" aria-selected="${S.page==="make"}">New poster</button>
    <button class="tab" role="tab" data-go="queue" aria-selected="${S.page==="queue"}">Posters${open?`<span class="n">${open}</span>`:""}</button>`;
}
function render(){ renderTabs(); $("#app").innerHTML = S.page==="make" ? viewMake() : viewQueue(); }
function renderSummary(){ const el=$("#sum"); if(el) el.outerHTML=viewSummary(); }

function viewMake(){
  const f=S.form;
  return `<div class="grid"><div class="steps">
  ${!S.db&&S.ready?`<div class="offline">Not connected. Sign in again to save briefs and see your posters.</div>`:""}
  <section class="step" aria-labelledby="s1"><div class="step-h"><span class="num">1</span><h2 id="s1">What is it for?</h2></div>
    <div class="chips" role="group" aria-label="Kind of poster">${KINDS.map(([k,n])=>`<button class="chip" data-kind="${k}" aria-pressed="${f.kind===k}">${n}</button>`).join("")}</div>
    ${f.kind==="sermon"?`<label class="toggle" for="fromEkk"><input type="checkbox" id="fromEkk" data-f="fromEkk" ${f.fromEkk?"checked":""}><div><b>Get the title from Ekklesia</b><span>Claude looks up the sermon preached on the date below in the Ekklesia app and uses its title and main scripture.</span></div></label>
    <div class="row"><label class="f" for="sermonDate">Sermon date<input type="date" id="sermonDate" data-f="sermonDate" value="${esc(f.sermonDate)}"></label><div></div></div>`:""}
  </section>

  <section class="step" aria-labelledby="s2"><div class="step-h"><span class="num">2</span><h2 id="s2">The words</h2><p>Spelled exactly as they should appear</p></div>
    <label class="f" for="title">Title${f.kind==="sermon"&&f.fromEkk?" (leave empty to use Ekklesia's)":""}<input type="text" id="title" data-f="title" value="${esc(f.title)}" placeholder="${f.kind==="sermon"&&f.fromEkk?"From Ekklesia":"e.g. Night of Wonders"}"></label>
    <div class="row">
      <label class="f" for="subtitle">Subtitle or theme<input type="text" id="subtitle" data-f="subtitle" value="${esc(f.subtitle)}" placeholder="optional"></label>
      <label class="f" for="scripture">Scripture<input type="text" id="scripture" data-f="scripture" value="${esc(f.scripture)}" placeholder="optional, e.g. 2 Kings 2:9"></label>
    </div>
    <div class="row">
      <label class="f" for="speaker">Speaker<input type="text" id="speaker" data-f="speaker" value="${esc(f.speaker)}" placeholder="e.g. Pastor James"></label>
      <label class="f" for="details">Date, time and place<input type="text" id="details" data-f="details" value="${esc(f.details)}" placeholder="optional, e.g. Sunday 2–6 pm"></label>
    </div>
    <label class="f" for="extra">One more line<input type="text" id="extra" data-f="extra" value="${esc(f.extra)}" placeholder="optional, e.g. Join us live on YouTube"></label>
  </section>

  <section class="step" aria-labelledby="s3"><div class="step-h"><span class="num">3</span><h2 id="s3">Photos</h2><p>Tap to use · ${f.photos.length} chosen</p></div>
    <div class="people">
      ${S.people.map(p=>`<button class="person" data-person="${esc(p.id)}" aria-pressed="${f.photos.some(x=>x.asset===p.asset)}"><img src="${blob(p.asset)}" alt="" loading="lazy"><span>${esc(p.name||"Photo")}</span></button>`).join("")}
      ${S.assets?`<label class="add" for="addPhoto"><input type="file" id="addPhoto" accept="image/*" multiple>${S.busy.photo?"Uploading…":"+ Add a photo"}<br><small style="font-weight:400">Clear, well-lit, waist-up works best</small></label>`:""}
    </div>
    ${f.photos.length?`<div class="row">${f.photos.map(ph=>`<label class="f" for="pn-${esc(ph.asset)}">Who is this?<input type="text" id="pn-${esc(ph.asset)}" data-pname="${esc(ph.asset)}" value="${esc(ph.name)}" placeholder="e.g. Pastor James"></label>`).join("")}</div>`:""}
    ${!S.people.length&&!S.assets?`<p class="hint">Photos appear here once you’re signed in.</p>`:""}
  </section>

  <section class="step" aria-labelledby="s4"><div class="step-h"><span class="num">4</span><h2 id="s4">Style</h2><p>Pick up to 3 · one poster each</p></div>
    <div class="style-tools">
      <div class="chips" role="group" aria-label="Style group"><button class="chip" data-filter="all" aria-pressed="${S.filter==="all"}">All ${STYLES.length}</button>${GROUPS.map(([g,n])=>`<button class="chip" data-filter="${g}" aria-pressed="${S.filter===g}">${n}</button>`).join("")}</div>
      <input type="text" id="q" placeholder="Search styles or occasions" value="${esc(S.q)}" aria-label="Search styles">
      ${S.sample?`<button class="btn ghost small" id="suggestBtn" ${S.busy.suggest?"disabled":""}>${S.busy.suggest?"Thinking…":"Suggest styles for this"}</button>`:""}
    </div>
    <div class="styles">${viewStyles()}</div>
    ${f.styles.length?`<div class="detail">${f.styles.map(id=>{const s=STYLE_BY_ID[id]; return `<div><h3>${esc(s.name)}</h3><p>${esc(s.blurb)} <i>Best for: ${esc(s.best)}</i>${S.suggest[id]?`<br><b>Why Claude suggests it:</b> ${esc(S.suggest[id])}`:""}</p></div>`;}).join("")}</div>`:""}
  </section>

  <section class="step" aria-labelledby="s5"><div class="step-h"><span class="num">5</span><h2 id="s5">Inspiration image</h2><p>Optional</p></div>
    <div class="insp">
      ${f.insp?`<div class="insp-img"><img src="${blob(f.insp)}" alt="Inspiration image"></div>`:`<label class="add" for="addInsp" style="min-height:110px"><input type="file" id="addInsp" accept="image/*">${S.busy.insp?"Uploading…":"+ Upload a poster you like"}</label>`}
      <div style="display:grid;gap:10px">
        <p class="hint">Gemini blends it with your style. It never copies the other poster's words, people or logos.</p>
        <div class="chips" role="group" aria-label="How closely to follow it">
          <button class="chip" data-insp="loose" aria-pressed="${f.inspMode==="loose"}">Mood and colours only</button>
          <button class="chip" data-insp="close" aria-pressed="${f.inspMode==="close"}">Follow its layout closely</button>
        </div>
        ${f.insp?`<div><button class="btn ghost small" id="clearInsp">Remove image</button></div>`:""}
      </div>
    </div>
  </section>

  <section class="step" aria-labelledby="s6"><div class="step-h"><span class="num">6</span><h2 id="s6">Sizes and finishing</h2></div>
    <div class="fmts">${FORMATS.map(m=>`<button class="fmt" data-fmt="${m.id}" aria-pressed="${f.formats.includes(m.id)}"><span class="bw"><span class="box" style="width:${m.w}px;height:${m.h}px"></span></span><b>${m.name}</b><small>${m.use}</small></button>`).join("")}</div>
    <label class="toggle" for="logo"><input type="checkbox" id="logo" data-f="logo" ${f.logo?"checked":""}><div><b>Add the real CPIC logo</b><span>Gemini leaves the top-right corner clear and Claude places the official logo there, so it's never redrawn wrongly.</span></div></label>
    <label class="f" for="notes">Anything else for Claude and Gemini?<textarea id="notes" data-f="notes" placeholder="e.g. Use a bit of gold. Make Pastor look towards the title.">${esc(f.notes)}</textarea></label>
  </section>
  </div>
  ${viewSummary()}
  </div>
  <div class="mbar"><span><b>${combos(f).length}</b> poster${combos(f).length===1?"":"s"} in this brief</span><button class="btn red" id="toSum">Review and send</button></div>`;
}
function viewStyles(){
  const q=S.q.trim().toLowerCase();
  const pick=S.form.styles;
  const show=STYLES.filter(s=>(S.filter==="all"||s.group===S.filter)&&(!q||(s.name+" "+s.blurb+" "+s.best).toLowerCase().includes(q)));
  if(!show.length) return `<p class="hint" style="grid-column:1/-1">No style matches “${esc(S.q)}”.</p>`;
  let html="", last="";
  for(const s of show){
    if(S.filter==="all"&&!q&&s.group!==last){ last=s.group; html+=`<div class="group-h">${GROUPS.find(g=>g[0]===s.group)[1]}</div>`; }
    const i=pick.indexOf(s.id);
    html+=`<button class="sty" data-style="${s.id}" aria-pressed="${i>=0}" title="${esc(s.blurb)}"><svg viewBox="0 0 160 100" aria-hidden="true">${s.art}</svg>${i>=0?`<span class="pick">${i+1}</span>`:""}${S.suggest[s.id]?`<span class="sug">Suggested</span>`:""}<span class="t"><b>${esc(s.name)}</b><small>${esc(s.best)}</small></span></button>`;
  }
  return html;
}
function viewSummary(){
  const f=S.form, c=combos(f), pr=problems(f), lines=textLines(f);
  const first=c[0];
  return `<aside class="sum" id="sum" aria-label="Summary"><div class="sum-h"><h2>Your poster brief</h2><p>Claude runs this in Gemini, checks it, fixes mistakes and adds the logo.</p></div>
  <div class="sum-b">
    <div style="display:flex;align-items:baseline;gap:10px"><span class="count">${c.length}</span><span>poster${c.length===1?"":"s"} · ${f.styles.length} style${f.styles.length===1?"":"s"} × ${f.formats.length} size${f.formats.length===1?"":"s"}</span></div>
    ${c.length>6?`<p class="missing">That's a lot for one run. Each poster takes Claude a few minutes.</p>`:""}
    <dl class="kv">
      <dt>For</dt><dd>${esc(kindName(f.kind))}${f.kind==="sermon"&&f.fromEkk?` · ${esc(fmtDate(f.sermonDate))}`:""}</dd>
      ${lines.map(([k,v])=>`<dt>${esc(k.replace("Date, time and place","Details"))}</dt><dd>${esc(v)}</dd>`).join("")}
      <dt>Photos</dt><dd>${f.photos.length?esc(f.photos.map(p=>p.name||"Photo").join(", ")):"None"}</dd>
      <dt>Styles</dt><dd>${esc(f.styles.map(id=>STYLE_BY_ID[id].name).join(", ")||"—")}</dd>
      <dt>Sizes</dt><dd>${esc(f.formats.join(", ")||"—")}</dd>
      <dt>Inspiration</dt><dd>${f.insp?(f.inspMode==="close"?"Follow closely":"Mood only"):"None"}</dd>
    </dl>
    ${pr.map(p=>`<p class="missing">${esc(p)}</p>`).join("")}
    ${first?`<details class="prompt"><summary>See what Gemini will be asked</summary><pre>${esc(buildPrompt(f,first.style,first.format))}</pre><button class="btn ghost small" id="copyPrompt" style="margin-top:8px">Copy prompt</button></details>`:""}
    <button class="btn red" id="send" ${pr.length||!S.db||S.busy.send?"disabled":""}>${S.busy.send?"Sending…":"Send to Claude"}</button>
    <p class="hint">Then say <b>“Make my poster”</b> to Claude in chat.</p>
  </div></aside>`;
}

function viewQueue(){
  const jobs=[...S.jobs].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  return `<div class="how">
    <div><b>1 · Send a brief</b><p>Fill in New poster and press Send to Claude. It waits here as Queued.</p></div>
    <div><b>2 · Tell Claude</b><p>Claude opens Gemini in your browser, makes each poster, checks spelling and faces, and asks Gemini to fix mistakes.</p></div>
    <div><b>3 · Collect</b><p>Finished posters land here with the real CPIC logo. Download them, have Claude check one again, or ask for changes.</p></div>
  </div>
  <div class="say"><q>Make my poster</q><span>Say this to Claude in chat to run everything that's queued or waiting for changes.</span><button class="btn small" id="copySay">Copy</button></div>
  ${!S.ready?`<div class="empty">Loading posters…</div>`:jobs.length?`<div class="jobs">${jobs.map(viewJob).join("")}</div>`:`<div class="empty">No posters yet. Start one under New poster.</div>`}
  ${S.old.length?`<h2 style="margin:32px 0 12px;font-size:16px">Earlier posters (old studio)</h2><div class="old">${S.old.map(o=>`<figure><img src="${blob(o.asset)}" alt="${esc(o.title)}" loading="lazy"><figcaption><span>${esc(o.title||"Poster")}</span>${S.dl?`<button class="btn ghost small" data-dlold="${esc(o.id)}">Download</button>`:""}</figcaption></figure>`).join("")}</div>`:""}`;
}
const ST_LABEL={queued:"Queued",changes:"Changes asked",working:"Claude is working",done:"Done",failed:"Needs attention"};
function viewJob(j){
  const f=j.brief||{}; const res=j.results||[];
  const want=(f.styles||[]).length*(f.formats||[]).length;
  return `<article class="job" data-st="${esc(j.status)}"><div class="job-h"><h3>${esc(j.title||f.title||"Untitled poster")}</h3><span class="pill ${esc(j.status)}">${esc(ST_LABEL[j.status]||j.status)}</span>
    <div class="meta">${esc(kindName(f.kind))} · ${esc((f.styles||[]).map(id=>STYLE_BY_ID[id]?.name||id).join(", "))} · ${esc((f.formats||[]).join(", "))} · sent ${esc(fmtDate(j.createdAt))} · ${res.length}/${want} made</div></div>
    ${j.note?`<p style="margin:0">${esc(j.note)}</p>`:""}
    ${res.length?`<div class="results">${res.map((r,i)=>viewResult(j,r,i)).join("")}</div>`:j.status==="queued"?`<p class="hint">Waiting for you to say “Make my poster” to Claude.</p>`:""}
    ${(j.changes||[]).filter(c=>!c.done).length?`<div class="check fix"><b>Changes you asked for</b><ul>${j.changes.filter(c=>!c.done).map(c=>`<li>${esc(c.text)}${c.result!=null&&res[c.result]?` <i>(${esc(res[c.result].label||"")})</i>`:""}</li>`).join("")}</ul></div>`:""}
    ${(j.log||[]).length?`<details><summary class="hint" style="cursor:pointer">What Claude did (${j.log.length})</summary><ul class="log">${j.log.map(l=>`<li>${esc(l.text)}</li>`).join("")}</ul></details>`:""}
    <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small" data-change="${esc(j.id)}">Ask for changes</button>
      <button class="btn ghost small" data-reuse="${esc(j.id)}">Use as new brief</button>
      <button class="btn ghost small" data-del="${esc(j.id)}">Delete</button>
    </div>
  </article>`;
}
function viewResult(j,r,i){
  const key=j.id+":"+i; const ck=S.checks[key]||r.check;
  return `<div class="res"><img src="${blob(r.asset)}" alt="${esc(r.label||"Poster")}" loading="lazy"><div class="rb"><b>${esc(r.label||"")}</b>
    ${ck?`<div class="check ${ck.ok?"ok":"fix"}">${ck.ok?"Claude's check: looks good.":"Claude's check found:"}${ck.issues&&ck.issues.length?`<ul>${ck.issues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`:""}
    <div class="acts">${S.dl?`<button class="btn small" data-dl="${esc(key)}">Download</button>`:""}${S.sample&&S.imgOK?`<button class="btn ghost small" data-check="${esc(key)}" ${S.busy[key]?"disabled":""}>${S.busy[key]?"Checking…":"Check again"}</button>`:""}<button class="btn ghost small" data-change="${esc(j.id)}" data-ri="${i}">Change this one</button></div>
  </div></div>`;
}

/* ---------- actions ---------- */
async function shrink(file, max=2200){
  const img=await createImageBitmap(file); const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const type=/png|webp/.test(file.type)?"image/png":"image/jpeg";
  const b=await new Promise(r=>c.toBlob(r,type,0.92));
  return new File([b], file.name.replace(/\.\w+$/,"")+(type==="image/png"?".png":".jpg"), {type});
}
async function upload(file){ const f=await shrink(file); return S.assets.upload(f); }
async function addPhotos(files){
  if(!S.assets) return; S.busy.photo=true; render();
  try{ for(const file of files){ const r=await upload(file); const id=uid(); const name=file.name.replace(/\.\w+$/,"").replace(/[_-]+/g," ").slice(0,40);
      const p={id,name,role:"",asset:r.id,addedAt:new Date().toISOString()};
      if(S.db) await S.db.doc("people/"+id).set({name:p.name,role:"",asset:p.asset,addedAt:p.addedAt});
      if(!S.people.some(x=>x.id===id)) S.people.unshift(p);
      S.form.photos.push({asset:r.id,name:p.name}); }
    keep(); toast("Photo added. Rename it below the picture so Gemini knows who it is.");
  }catch(e){ console.warn(e); toast("That photo couldn't be uploaded. Try a JPG or PNG under 20 MB."); }
  S.busy.photo=false; render();
}
async function addInsp(file){
  if(!S.assets) return; S.busy.insp=true; render();
  try{ const r=await upload(file); S.form.insp=r.id; keep(); }catch(e){ toast("That image couldn't be uploaded."); }
  S.busy.insp=false; render();
}
async function send(){
  const f=S.form; if(problems(f).length||!S.db) return;
  S.busy.send=true; renderSummary();
  const id=new Date().toISOString().slice(0,10)+"-"+uid();
  const job={ title: f.title.trim() || (f.kind==="sermon"&&f.fromEkk?`Sermon of ${fmtDate(f.sermonDate)}`:"Poster"), status:"queued",
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    brief: JSON.parse(JSON.stringify(f)),
    prompts: combos(f).map(c=>({style:c.style, format:c.format, prompt:buildPrompt(f,c.style,c.format)})),
    results:[], log:[], changes:[] };
  try{ await S.db.doc("jobs/"+id).set(job); S.page="queue"; toast("Sent. Now tell Claude: “Make my poster”."); render(); window.scrollTo(0,0); }
  catch(e){ console.warn(e); toast("It couldn't be saved. Check you're signed in and try again."); }
  S.busy.send=false; if(S.page==="make") renderSummary();
}
async function suggest(){
  if(!S.sample) return; S.busy.suggest=true; render();
  const f=S.form;
  const list=STYLES.map(s=>`${s.id}: ${s.name} — ${s.blurb} Best for: ${s.best}`).join("\n");
  const prompt=`You help a church media team in Dubai choose poster styles. Event: ${kindName(f.kind)}. Title: ${f.title||"(sermon title from the church app)"}. Subtitle: ${f.subtitle}. Scripture: ${f.scripture}. Notes: ${f.notes}.\nStyles:\n${list}\nPick the 3 styles that would be most eye-catching and fitting for this church poster. Prefer variety. Reply as JSON only: {"picks":[{"id":"style-id","why":"one short sentence"}]}`;
  try{ const r=await S.sample.json(prompt,{modelTier:"quick"}); const picks=(r&&r.picks||[]).filter(p=>STYLE_BY_ID[p.id]).slice(0,3);
    S.suggest={}; picks.forEach(p=>S.suggest[p.id]=p.why); if(picks.length){ S.filter="all"; S.q=""; toast("Suggestions are marked. Tap one to pick it."); } else toast("Claude didn't return suggestions. Try again.");
  }catch(e){ toast(e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":"Suggestions aren't available right now."); }
  S.busy.suggest=false; render();
}
async function checkResult(key){
  const [jid,i]=key.split(":"); const j=S.jobs.find(x=>x.id===jid); const r=j&&j.results[+i]; if(!r||!S.sample) return;
  S.busy[key]=true; render();
  try{ const b=await (await fetch(blob(r.asset))).blob();
    const lines=textLines(Object.assign({title:"",subtitle:"",scripture:"",speaker:"",details:"",extra:""},j.brief||{},{title:j.title||""}));
    const prompt=`You are proofreading a church poster before it is posted. Expected text (exact spelling):\n${lines.map(([k,v])=>`- ${k}: ${v}`).join("\n")}\nCheck: every expected line present and spelled exactly; no extra or garbled words; nothing cut off at the edges; faces look natural (no extra fingers, warped glasses or eyes); the CPIC logo, if present, is not distorted; text readable against its background. Reply as JSON only: {"ok":true|false,"issues":["short plain sentence", ...]}`;
    const res=await S.sample.json(prompt,{images:[b],modelTier:"default"});
    const ck={ok:!!(res&&res.ok), issues:(res&&res.issues||[]).slice(0,6), at:new Date().toISOString()}; S.checks[key]=ck;
    if(S.db){ const results=j.results.map((x,k)=>k===+i?Object.assign({},x,{check:ck}):x); await S.db.doc("jobs/"+jid).update({results}).catch(()=>{}); }
  }catch(e){ toast("The check couldn't run just now."); }
  S.busy[key]=false; render();
}
async function download(key){
  const [jid,i]=key.split(":"); const j=S.jobs.find(x=>x.id===jid); const r=j&&j.results[+i]; if(!r||!S.dl) return;
  try{ const b=await (await fetch(blob(r.asset))).blob(); const ext=(b.type.split("/")[1]||"png").replace("jpeg","jpg");
    await S.dl.save({filename:`cpic-${(j.title||"poster").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,50)}-${(r.label||i).toString().toLowerCase().replace(/[^a-z0-9]+/g,"-")}.${ext}`,data:b});
  }catch(e){ if(!(e&&e.code==="cancelled")) toast("It couldn't be downloaded."); }
}
function askChange(jid, ri){
  const j=S.jobs.find(x=>x.id===jid); if(!j) return;
  const label = ri!=null && j.results[ri] ? j.results[ri].label : "";
  $("#layer").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div>
    <h2 id="mh" style="font-size:17px">What should change${label?` on “${esc(label)}”`:""}?</h2>
    <label class="f" for="chg">Claude will ask Gemini for exactly this next time you say “Make my poster”.<textarea id="chg" placeholder="e.g. Make the title bigger. Use a warmer orange. Pastor's glasses look odd."></textarea></label>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="mClose">Cancel</button><button class="btn red" id="mSave" data-j="${esc(jid)}" data-ri="${ri??""}">Save changes</button></div></div></div>`;
  $("#chg").focus();
}
async function saveChange(jid, ri){
  const t=$("#chg").value.trim(); if(!t){ $("#chg").focus(); return; }
  const j=S.jobs.find(x=>x.id===jid); if(!j||!S.db) return;
  const changes=[...(j.changes||[]),{text:t,result:ri===""?null:+ri,at:new Date().toISOString(),done:false}];
  try{ await S.db.doc("jobs/"+jid).update({changes,status:"changes",updatedAt:new Date().toISOString()}); $("#layer").innerHTML=""; toast("Saved. Tell Claude: “Make my poster”."); }
  catch(e){ toast("It couldn't be saved."); }
}
function confirmDel(jid){
  $("#layer").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dh"><div><h2 id="dh" style="font-size:17px">Delete this poster job?</h2><p class="hint">Its posters disappear from this list. Copies you downloaded stay on your device.</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="mClose">Keep it</button><button class="btn red" id="dYes" data-j="${esc(jid)}">Delete</button></div></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return; const d=t.dataset; const f=S.form;
  if(d.go){ S.page=d.go; render(); window.scrollTo(0,0); return; }
  if(d.kind){ f.kind=d.kind; keep(); render(); return; }
  if(d.filter){ S.filter=d.filter; render(); return; }
  if(d.style){ const i=f.styles.indexOf(d.style); if(i>=0) f.styles.splice(i,1); else { if(f.styles.length>=3){ toast("Up to 3 styles at a time. Tap one to remove it first."); return; } f.styles.push(d.style); } keep(); render(); return; }
  if(d.person){ const p=S.people.find(x=>x.id===d.person); if(!p) return; const i=f.photos.findIndex(x=>x.asset===p.asset); if(i>=0) f.photos.splice(i,1); else f.photos.push({asset:p.asset,name:p.name}); keep(); render(); return; }
  if(d.fmt){ const i=f.formats.indexOf(d.fmt); if(i>=0) f.formats.splice(i,1); else f.formats.push(d.fmt); keep(); render(); return; }
  if(d.insp){ f.inspMode=d.insp; keep(); render(); return; }
  if(t.id==="clearInsp"){ f.insp=null; keep(); render(); return; }
  if(t.id==="send") return send();
  if(t.id==="toSum"){ $("#sum").scrollIntoView({behavior:"smooth"}); return; }
  if(t.id==="suggestBtn") return suggest();
  if(t.id==="copyPrompt"){ const c=combos(f)[0]; try{ await navigator.clipboard.writeText(buildPrompt(f,c.style,c.format)); toast("Prompt copied."); }catch(_){ toast("Copy isn't allowed here. Select the text instead."); } return; }
  if(t.id==="copySay"){ try{ await navigator.clipboard.writeText("Make my poster"); toast("Copied. Paste it to Claude."); }catch(_){ toast("Type “Make my poster” to Claude."); } return; }
  if(d.dl) return download(d.dl);
  if(d.dlold){ const o=S.old.find(x=>x.id===d.dlold); if(!o||!S.dl) return; try{ const b=await (await fetch(blob(o.asset))).blob(); await S.dl.save({filename:`cpic-${(o.title||"poster").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.png`,data:b}); }catch(_){} return; }
  if(d.check) return checkResult(d.check);
  if(d.change) return askChange(d.change, d.ri===undefined||d.ri===""?null:+d.ri);
  if(t.id==="mClose"){ $("#layer").innerHTML=""; return; }
  if(t.id==="mSave") return saveChange(d.j, d.ri);
  if(d.del) return confirmDel(d.del);
  if(t.id==="dYes"){ try{ await S.db.doc("jobs/"+d.j).delete(); }catch(_){ toast("It couldn't be deleted."); } $("#layer").innerHTML=""; return; }
  if(d.reuse){ const j=S.jobs.find(x=>x.id===d.reuse); if(j&&j.brief){ Object.assign(S.form, JSON.parse(JSON.stringify(j.brief))); keep(); S.page="make"; render(); window.scrollTo(0,0); toast("Brief loaded. Change what you need and send it."); } return; }
});
document.addEventListener("input", e=>{
  const t=e.target, k=t.dataset.f;
  if(t.id==="q"){ S.q=t.value; const g=document.querySelector(".styles"); if(g) g.innerHTML=viewStyles(); return; }
  if(t.dataset.pname){ const ph=S.form.photos.find(x=>x.asset===t.dataset.pname); if(ph){ ph.name=t.value; keep(); renderSummary(); } return; }
  if(!k) return;
  S.form[k] = t.type==="checkbox" ? t.checked : t.value; keep();
  if(t.type==="checkbox"||k==="sermonDate"){ const y=window.scrollY; render(); window.scrollTo(0,y); } else renderSummary();
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="addPhoto"&&t.files.length) addPhotos([...t.files]);
  if(t.id==="addInsp"&&t.files[0]) addInsp(t.files[0]);
  if(t.dataset.pname&&S.db){ const p=S.people.find(x=>x.asset===t.dataset.pname); if(p&&t.value.trim()&&p.name!==t.value.trim()){ p.name=t.value.trim(); S.db.doc("people/"+p.id).update({name:p.name}).catch(()=>{}); } }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&$("#layer").innerHTML){ $("#layer").innerHTML=""; } });

/* ---------- boot ---------- */
render();
(async()=>{
  if(!(window.claude&&claude.use)){ S.ready=true; render(); return; }
  const [db,assets,dl,sample]=await Promise.all(["db","assets","downloads","sample"].map(n=>claude.use(n).catch(()=>null)));
  S.db=db; S.assets=assets; S.dl=dl; S.sample=sample;
  if(sample){ try{ const l=await sample.limits(); S.imgOK=!!(l&&l.images); }catch(_){} }
  const timer=setTimeout(()=>{ S.ready=true; render(); },10000);
  if(db){
    db.collection("jobs").limit(300).onSnapshot(q=>{ clearTimeout(timer); S.ready=true; S.jobs=q.docs.map(d=>Object.assign({id:d.id},d.data())); const y=window.scrollY; if(S.page==="queue"||!$("#app").innerHTML) render(); else renderTabs(); window.scrollTo(0,y); },()=>{ S.ready=true; render(); });
    db.collection("people").limit(200).onSnapshot(q=>{ S.people=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.addedAt).localeCompare(String(a.addedAt)));
      let fresh=true; try{ fresh=!localStorage.getItem("cpic-ps-form"); }catch(_){}
      if(!S.form.photos.length&&S.people[0]&&fresh) S.form.photos=[{asset:S.people[0].asset,name:S.people[0].name}];
      S.form.photos=S.form.photos.filter(ph=>S.people.some(p=>p.asset===ph.asset));
      if(S.page==="make"){ const y=window.scrollY; render(); window.scrollTo(0,y); } },()=>{});
    db.collection("posters").limit(200).onSnapshot(q=>{ S.old=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(o=>o.asset).sort((a,b)=>String(b.madeAt).localeCompare(String(a.madeAt))); if(S.page==="queue") render(); },()=>{});
  } else { clearTimeout(timer); S.ready=true; }
  render();
})();
</script>
</body>
