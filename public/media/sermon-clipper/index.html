<style>
/* Layout: sticky header (logo, title, privacy note); a setup screen with two drop zones until a video is loaded; then a two-column workspace (player + timeline on the left, transcript/clips on the right) above a "Look" settings card */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#E9EBF5; --ink:#1A1C22; --muted:#4B4F5C; --line:#D9DCEA;
  --navy:#1C287B; --navy-ink:#FFFFFF; --night:#0E1438; --tint:#E9EBF5;
  --ok:#0E7C53; --ok-soft:#DDF3E9; --warn:#9A5600; --warn-soft:#FBEBD3; --bad:#B42335; --bad-soft:#F8DFE2;
  --f-display:Montserrat,"Arial Black",Arial,sans-serif; --f-body:"Open Sans",Arial,sans-serif; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1438; --surface:#161D4A; --surface-2:#1F2860; --ink:#E9EBF5; --muted:#B4B9D2; --line:#2C3570;
  --navy:#E9EBF5; --navy-ink:#1C287B; --tint:#1F2860;
  --ok:#4CC995; --ok-soft:#12352A; --warn:#F0B45A; --warn-soft:#3A2A12; --bad:#F27C8A; --bad-soft:#3D1A21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1438; --surface:#161D4A; --surface-2:#1F2860; --ink:#E9EBF5; --muted:#B4B9D2; --line:#2C3570;
  --navy:#E9EBF5; --navy-ink:#1C287B; --tint:#1F2860;
  --ok:#4CC995; --ok-soft:#12352A; --warn:#F0B45A; --warn-soft:#3A2A12; --bad:#F27C8A; --bad-soft:#3D1A21; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;border:1px solid var(--line)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1;color:var(--navy)}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.privacy{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.privacy svg{width:15px;height:15px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h2.title{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.15;color:var(--navy);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:72ch}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.section h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--navy)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.big{min-height:50px;padding:12px 22px;font-size:16px}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn svg{width:17px;height:17px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 11px;min-height:40px}
textarea{min-height:110px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--navy)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* setup */
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.drops{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--surface);padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;min-height:200px;justify-content:center}
.drop.over{border-color:var(--navy);background:var(--tint)}
.drop.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.drop svg{width:40px;height:40px;color:var(--navy)}
.drop>b{font-family:var(--f-display);font-size:18px;color:var(--navy)}
.steps-how{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted)}
.steps-how li{margin:2px 0}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.ws{grid-template-columns:1fr}}
.player{background:#000;border-radius:var(--r);overflow:hidden;position:relative}
.player video{width:100%;display:block;max-height:58vh;background:#000}
.subov{position:absolute;left:5%;right:5%;bottom:14%;text-align:center;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2.4vw,26px);color:#fff;text-shadow:0 0 4px #000,0 0 4px #000,0 2px 6px #000}
.tl{position:relative;height:46px;background:var(--surface-2);border-radius:6px;cursor:pointer;overflow:hidden;touch-action:none}
.tl .blk{position:absolute;top:6px;bottom:6px;background:var(--navy);opacity:.35;border-radius:3px}
.tl .blk.sel{opacity:.85}
.tl .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ok)}
.tl .mk.out{background:var(--bad)}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.tl .sp{position:absolute;bottom:0;height:5px;background:var(--muted);opacity:.45}
.tl-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.markbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;border-bottom:3px solid transparent;padding:9px 12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tx{max-height:62vh;overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cue{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:14px;line-height:1.4}
.cue:hover{background:var(--tint)}
.cue .t{font-size:12px;color:var(--muted);padding-top:2px}
.cue.now{background:var(--tint);box-shadow:inset 3px 0 0 var(--navy)}
.cue.inclip .t{color:var(--navy);font-weight:700}
.cue.rng{background:var(--ok-soft)}
mark{background:#FFE58A;color:#1A1C22;border-radius:2px}
.clips{display:flex;flex-direction:column;gap:12px}
.clip{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.clip.sel{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.clip .head{display:flex;gap:8px;align-items:center}
.clip .head input{font-weight:700;font-family:var(--f-display);color:var(--navy)}
.clip .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.lines{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.lines label{display:grid;grid-template-columns:22px 52px 1fr;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;align-items:start}
.lines label.off span:last-child{text-decoration:line-through;color:var(--muted)}
.lines input{accent-color:var(--navy);margin-top:3px}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--navy);transition:width .2s}
.result{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.result video{width:150px;border-radius:6px;background:#000}
.result.wide video{width:260px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);border:1px solid var(--line);font-size:14px}
.banner.info{background:var(--tint)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}
.look{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.look{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.look{grid-template-columns:1fr}}
.find-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.find-grid{grid-template-columns:1fr}}
.prevbox{display:flex;justify-content:center;background:var(--night);border-radius:var(--r);padding:12px}
.prevbox canvas{max-height:360px;max-width:100%;height:auto;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:#0E1438;color:#fff;padding:10px 12px 10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.toast button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer}
kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
</style>

/* ---------------- transcript parsing ---------------- */
function cleanText(t){ return t.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g," ").trim(); }
function parseTranscript(raw){
  const text=raw.replace(/\r/g,"").replace(/^\uFEFF/,"");
  let cues=[];
  const tsRe=/((?:\d+:)?\d{1,2}:\d{2}[.,]\d{1,3})\s*-->\s*((?:\d+:)?\d{1,2}:\d{2}[.,]\d{1,3})/;
  if(tsRe.test(text)){
    for(const block of text.split(/\n\s*\n/)){
      const ls=block.split("\n"); const i=ls.findIndex(l=>tsRe.test(l)); if(i<0) continue;
      const m=ls[i].match(tsRe); const t=cleanText(ls.slice(i+1).join(" ")); if(!t) continue;
      cues.push({s:parseTime(m[1].replace(",",".")),e:parseTime(m[2].replace(",",".")),t});
    }
  } else if(/^\d+:\d{2}:\d{2}\.\d{3},\d+:\d{2}:\d{2}\.\d{3}$/m.test(text)){ /* .sbv */
    for(const block of text.split(/\n\s*\n/)){ const ls=block.trim().split("\n"); const m=ls[0]&&ls[0].match(/^([\d:.]+),([\d:.]+)$/); if(!m) continue; const t=cleanText(ls.slice(1).join(" ")); if(t) cues.push({s:parseTime(m[1]),e:parseTime(m[2]),t}); }
  } else { /* YouTube "Show transcript" copy: a time on its own line, then words */
    const ls=text.split("\n").map(l=>l.trim()).filter(Boolean); let cur=null;
    for(const l of ls){ const m=l.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*(.*)$/); if(m){ if(cur) cues.push(cur); cur={s:parseTime(m[1]),e:NaN,t:cleanText(m[2]||"")}; } else if(cur){ cur.t=(cur.t+" "+cleanText(l)).trim(); } }
    if(cur) cues.push(cur);
    for(let i=0;i<cues.length;i++) cues[i].e=i+1<cues.length?cues[i+1].s:cues[i].s+4;
  }
  cues=cues.filter(c=>isFinite(c.s)&&isFinite(c.e)&&c.t).sort((a,b)=>a.s-b.s);
  /* YouTube's rolling captions repeat the previous line; keep only the new words */
  for(let i=1;i<cues.length;i++){ const p=cues[i-1].t, c=cues[i].t; if(c.startsWith(p)&&c.length>p.length) cues[i].t=c.slice(p.length).trim(); else if(c===p) cues[i].t=""; }
  cues=cues.filter(c=>c.t&&c.e>c.s);
  for(let i=0;i<cues.length-1;i++) if(cues[i].e>cues[i+1].s) cues[i].e=Math.max(cues[i].s+0.2,cues[i+1].s);
  return cues;
}
/* spread each caption line's words across its time, longer words taking longer */
function wordsOf(c){ const ws=c.t.replace(/\[[^\]]*\]/g," ").split(/\s+/).filter(Boolean); const tot=ws.reduce((a,w)=>a+w.length+1,0)||1; let t=c.s; return ws.map(w=>{ const d=(c.e-c.s)*(w.length+1)/tot; const r={w,s:t,e:t+d}; t+=d; return r; }); }
const cueIdx=(a,b)=>{ const r=[]; S.cues.forEach((c,i)=>{ if(c.e>a+0.05&&c.s<b-0.05) r.push(i); }); return r; };
function snap(a,b){ if(!S.cues.length) return [a,b];
  const ca=S.cues.find(c=>c.e>a+0.2); const cb=[...S.cues].reverse().find(c=>c.s<b-0.2);
  let s=ca&&Math.abs(ca.s-a)<4?Math.min(a,ca.s):a, e=cb&&Math.abs(cb.e-b)<4?Math.max(b,cb.e):b;
  return [Math.max(0,s-0.05),Math.min(S.dur||e+1,e+0.15)]; }

/* ---------------- loading ---------------- */
async function loadVideo(file){
  if(S.url) URL.revokeObjectURL(S.url);
  Object.assign(S,{file,url:URL.createObjectURL(file),ready:false,clips:[],sel:null,mark:{in:null,out:null}});
  render(); toast("Opening the video…");
  try{
    S.input=new MB.Input({source:new MB.BlobSource(file),formats:MB.ALL_FORMATS});
    S.vtrack=await S.input.getPrimaryVideoTrack(); S.atrack=await S.input.getPrimaryAudioTrack();
    if(!S.vtrack) throw new Error("no video track");
    S.vw=S.vtrack.displayWidth; S.vh=S.vtrack.displayHeight; S.dur=await S.input.computeDuration();
    if(!(await S.vtrack.canDecode())) toast("This browser can’t read this video’s format. Try Chrome or Edge, or download the MP4 from YouTube Studio.");

let wmImg=null; async function wm(){ if(wmImg) return wmImg; const im=new Image(); im.src=WM_SRC; await im.decode(); return wmImg=im; }

      const lines=wrapLines(ctx,c.ws,W*0.84), lh=fs*1.25, y0=(vert?H*0.7:sq?H*0.8:H*0.86)-(lines.length-1)*lh/2;

}

/* ---------------- render a clip ---------------- */
async function ensureEncoders(){

  const v=await MB.canEncodeVideo("avc",{width:1080,height:1920});
  if(!v){ S.encOK=false; return false; }
  if(!(await MB.canEncodeAudio("aac"))){ try{ const m=await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.65.0/dist/bundles/mediabunny-aac-encoder.min.mjs"); m.registerAacEncoder(); S.aacReady=true; }catch(e){ console.warn(e); S.encOK=false; return false; } }

}

/* ---------------- history: every clip made, kept for the team to download again ---------------- */
function videoKey(){ const k=`${S.file.name}|${S.file.size}`; let h=5381; for(let i=0;i<k.length;i++) h=((h<<5)+h+k.charCodeAt(i))>>>0; return "v"+h.toString(36); }
async function saveToHistory(clip){

    const vid=videoKey(), docId=`${clip.id}_${clip.fmt}`, prev=S.history.made.find(m=>m.id===docId);
    await S.db.doc("videos/"+vid).set({name:S.file.name,size:S.file.size,title:sermon()?sermon().title:S.file.name.replace(/\.[^.]+$/,""),sermonId:S.sermonId||"",ytLink:S.ytLink||"",updatedAt:new Date().toISOString()});

    const slug=(m.title||"clip").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"clip";
    await S.dl.save({filename:`cpic-${slug}${m.fmt&&m.fmt!=="vertical"?"-"+m.fmt:""}.mp4`,data:new Blob(blobs,{type:"video/mp4"})});
  }catch(e){ if(!(e&&e.code==="declined")) toast(e&&e.message==="missing"?"This clip’s file is no longer stored.":"The clip couldn’t be downloaded. Try again."); }

function blocks(){ const out=[]; let cur=null;
  S.cues.forEach((c,i)=>{ if(!cur) cur={id:out.length,s:c.s,e:c.e,t:"",cues:[]}; cur.t=(cur.t+" "+c.t).trim(); cur.e=c.e; cur.cues.push(i);
    if(cur.e-cur.s>=10||/[.!?]["”']?$/.test(c.t)&&cur.e-cur.s>=1.5){ out.push(cur); cur=null; } });
  if(cur) out.push(cur); return out; }
const sermon=()=>S.lib.sermons.find(x=>x.id===S.sermonId);
async function findClips(){
  const sc=findScope(), [lo,hi]=lenRange(), want=Math.max(1,Math.min(20,Math.round(Number(S.find.count)||5)));
  if(sc.b-sc.a<lo-1){ toast(`That part is only ${fmtLen(sc.b-sc.a)} long, shorter than the clip length you chose.`); return; }
  if(!S.cues.length || !S.sample){ await splitEvenly(sc,want,lo,hi); return; }
  const B=blocks().filter(b=>b.e>sc.a+0.5&&b.s<sc.b-0.5); if(!B.length){ toast("No words found in that part."); return; }
  S.aiBusy=true; S.find.open=false; render();
  const sm=sermon();
  const prompt=`You are the clip editor for Christ Power International Church (CPIC) in Dubai. Below is the transcript of a ${sm?sm.kind||"sermon":"sermon or Bible study"}${sm?` titled "${sm.title}" by ${sm.preacher}`:""}, split into numbered blocks with their start time in seconds.
Choose the ${want} best moments to post as short clips on TikTok, Instagram Reels and YouTube Shorts.${sc.parent||sc.a>0?` Only use the part of the transcript shown.`:""}
Rules:
- Return exactly ${want} clips if the transcript has enough good material, otherwise as many as truly work. Never pad with weak clips.
- Each clip runs from a start block to an end block and lasts between ${lo} and ${hi} seconds of speech (use the block times to judge length; dropped blocks don't count).
- Each clip must make sense on its own to someone who never saw the service: one clear idea, a strong first line, and an ending that lands (a conclusion, a declaration, a scripture, or a call to act).
- Start and end on complete sentences. Never start mid-thought.
- Inside a clip, list blocks to leave out in "drop": announcements, "turn to your neighbour", repeated words, false starts, side remarks and anything that breaks the flow. Never drop a block if the clip would stop making sense.
- Clips must not overlap each other. Prefer moments with scripture, memorable lines, testimony, or a clear challenge.
- Use only the words in the transcript.
Return JSON: {"clips":[{"title":"short punchy title, under 8 words, no emoji","startBlock":n,"endBlock":n,"drop":[n,...],"why":"one sentence"}]}

Transcript:
${B.map(b=>`#${b.id} [${Math.round(b.s)}s] ${b.t}`).join("\n")}`;
  try{
    const r=await S.sample.json(prompt,{modelTier:"complex"});
    const list=(r&&r.clips)||[]; let added=0; const newOnes=[];
    const byId=new Map(B.map(x=>[x.id,x]));
    for(const c of list){ const a=byId.get(c.startBlock), b=byId.get(c.endBlock); if(!a||!b||b.e<=a.s) continue;
      const [s,e]=snap(a.s,b.e); const drop=[].concat(...(c.drop||[]).map(id=>byId.has(id)?byId.get(id).cues:[]));
      if(S.clips.some(x=>x.id!==sc.parent&&!x.batch&&x.start<e-1&&x.end>s+1)) continue;
      if(newOnes.some(x=>x.start<e-1&&x.end>s+1)) continue;
      const nc={id:newId(),title:String(c.title||"Clip").slice(0,70),start:s,end:e,drop,caption:"",why:c.why||"",ai:true,batch:true}; newOnes.push(nc); S.clips.push(nc); added++; }
    newOnes.forEach(c=>delete c.batch);
    S.clips.sort((a,b)=>a.start-b.start); saveProj(); S.tab="clips";
    if(added) toast(`Claude made ${added} clip${added===1?"":"s"} ${sc.label}${added<want?` (only ${added} strong moments fit)`:""}`,"Undo",()=>{ const ids=new Set(newOnes.map(c=>c.id)); S.clips=S.clips.filter(c=>!ids.has(c.id)); saveProj(); render(); });
    else toast("Claude didn’t find clips that fit. Try a different length.");
  }catch(e){ console.warn(e); toast(e&&e.code==="not_granted"?"Claude wasn’t allowed for this page.":e&&e.code==="rate_limited"?"Claude is busy. Try again in a minute.":"Claude couldn’t read this transcript. Try again."); }
  S.aiBusy=false; render();
}
async function splitEvenly(sc,want,lo,hi){
  const span=sc.b-sc.a; const n=Math.max(1,Math.min(want,Math.floor(span/lo))); const piece=Math.min(hi,span/n);
  toast("No subtitles, so the part is split evenly at natural pauses…");
  const au=await decodeAudio(sc.a,sc.b); const en=au?energy(au,sc.a,sc.b):null;
  const quietNear=t=>{ if(!en) return t; let best=t,bv=Infinity; for(let x=t-2;x<=t+2;x+=0.02){ const k=Math.round((x-sc.a)/0.02); if(en[k]!==undefined&&en[k]<bv){ bv=en[k]; best=x; } } return Math.max(sc.a,Math.min(sc.b,best)); };
  const step=span/n, made=[];
  for(let i=0;i<n;i++){ const a=quietNear(sc.a+i*step), b=quietNear(Math.min(sc.b,a+piece)); if(b-a<5) continue; const c={id:newId(),title:`Part ${i+1}`,start:a,end:b,drop:[],caption:""}; made.push(c); S.clips.push(c); }
  S.clips.sort((x,y)=>x.start-y.start); S.find.open=false; S.tab="clips"; saveProj(); render();
  toast(`${made.length} clips made ${sc.label}`,"Undo",()=>{ const ids=new Set(made.map(c=>c.id)); S.clips=S.clips.filter(c=>!ids.has(c.id)); saveProj(); render(); });
}
function syncCaption(c){ if(!S.db||!S.isEditor) return; clearTimeout(c._cs); c._cs=setTimeout(()=>{ S.history.made.filter(m=>m.clipId===c.id).forEach(m=>S.db.doc("made/"+m.id).update({caption:c.caption||""}).catch(()=>{})); },1200); }
function keptText(clip){ const drop=new Set(clip.drop||[]); return cueIdx(clip.start,clip.end).filter(i=>!drop.has(i)).map(i=>S.cues[i].t).join(" "); }
async function writeCaption(clip){
  if(!S.sample){ toast("Claude isn’t switched on for cpic.info yet. Type the caption yourself."); return; }
  clip.capBusy=true; renderClips(); const sm=sermon();
  const prompt=`Write one caption for a short video clip from Christ Power International Church (CPIC), Dubai, to post on TikTok, Instagram Reels and YouTube Shorts.
Clip title: ${clip.title}
${sm?`From the ${sm.kind||"sermon"} "${sm.title}" by ${sm.preacher}${sm.date?" on "+sm.date:""}.`:""}
${S.cues.length?`What is said in the clip: ${keptText(clip).slice(0,4000)}`:""}
Follow the CPIC voice exactly:
- Warm, faith-filled, Scripture-rooted, never hype. Lead with God. Speak to one person with "you".
- First line is a hook taken from the clip's message. Then one or two short lines. Then one call to action: follow CPIC, share with someone who needs this, or watch the full message${S.ytLink?` (${S.ytLink})`:" on YouTube @christpowerintchurch"}.
- Under 90 words. Up to 3 emoji, only from: 🙌 🙏 🔥 ✨ 🕊️ 📖 💛.

Reply with only the caption.`;
  try{ const r=await S.sample(prompt,{cache:false}); clip.caption=r.text.trim(); saveProj(); syncCaption(clip); }
  catch(e){ toast(e&&e.code==="not_granted"?"Claude wasn’t allowed for this page.":"The caption couldn’t be written. Try again."); }
  clip.capBusy=false; renderClips();
}

      ${c.end-c.start>=45?`<button class="btn sm" data-split="${c.id}">Make more clips from this</button>`:""}
      ${S.cues.length?`<button class="btn sm" data-lines="${c.id}">${c.open?"Hide lines":"Choose lines"}${drop.size?` (${drop.size} cut)`:""}</button>`:""}</div>
    ${lines.length?`<div class="lines">${lines.map(i=>`<label class="${drop.has(i)?"off":""}"><input type="checkbox" data-keep="${c.id}:${i}" ${drop.has(i)?"":"checked"}><span class="small muted num">${fmt(S.cues[i].s)}</span><span>${esc(S.cues[i].t)}</span></label>`).join("")}</div><span class="hint">Untick lines to cut them: side remarks, announcements, repeats. Pauses are cut automatically.</span>`:""}
    <div class="field"><div class="row" style="justify-content:space-between"><span class="lbl">Caption</span><span class="row"><button class="btn sm" data-cap="${c.id}" ${c.capBusy?"disabled":""}>${c.capBusy?"Writing…":c.caption?"Write again":"Write with Claude"}</button>${c.caption?`<button class="btn sm" data-copy="${c.id}">Copy</button>`:""}</span></div>
      <textarea data-captxt="${c.id}" placeholder="The caption for posting appears here. You can edit it." style="min-height:${c.caption?110:60}px">${esc(c.caption||"")}</textarea></div>
    ${c.busy?`<div class="prog"><span data-prog="${c.id}" style="width:${Math.round((c.prog||0)*100)}%"></span></div><span class="small muted" data-stage="${c.id}">${esc(c.stage||"")}</span>`
      :c.err?`<div class="banner">${esc(c.err)}</div>`:""}
    ${c.blobUrl&&!c.busy?`<div class="result ${c.fmt==="wide"?"wide":""}"><video src="${c.blobUrl}#t=0.6" controls playsinline preload="metadata"></video><div style="display:flex;flex-direction:column;gap:8px"><span class="small num">Ready · ${fmtLen(c.outDur)} · ${FORMATS[c.fmt].label}</span>${c.hist==="saving"?`<span class="pill">Adding to History…</span>`:c.hist==="saved"?`<span class="pill ok">Saved in History</span>`:c.hist==="failed"?`<span class="pill warn">Not in History</span>`:""}<button class="btn sm primary" data-save="${c.id}">Download MP4</button>${c.srt?`<button class="btn sm" data-srt="${c.id}">Download subtitles (.srt)</button>`:""}</div></div>`:""}
    <div class="row" style="justify-content:space-between"><button class="btn ${c.blobUrl?"":"primary"}" data-make="${c.id}" ${c.busy?"disabled":""}>${c.blobUrl?"Make again with current look":"Make this clip"}</button><button class="btn sm danger" data-del="${c.id}">Remove</button></div>
  </div>`;
}
function viewLook(){ const st=S.style; const vert=FORMATS[st.format].w<FORMATS[st.format].h;
  return `<section class="section"><div class="row" style="justify-content:space-between"><h3>The look of every clip</h3><span class="small muted">Changes apply to clips you make next.</span></div>
  <div class="look">
    <div class="field"><span class="lbl">Shape</span><div class="seg">${Object.entries(FORMATS).map(([k,v])=>`<button data-fmt="${k}" aria-pressed="${st.format===k}" title="${esc(v.hint)}">${v.label}</button>`).join("")}</div><span class="hint">${esc(FORMATS[st.format].hint)}</span></div>
    ${vert?`<div class="field"><span class="lbl">Framing</span><div class="seg"><button data-fit="fill" aria-pressed="${st.fit==="fill"}">Zoom on speaker</button><button data-fit="blur" aria-pressed="${st.fit==="blur"}">Whole picture</button></div>
      ${st.fit==="fill"?`<label class="hint" for="cropX">Where the speaker stands</label><input type="range" id="cropX" min="0" max="1" step="0.01" value="${st.cropX}">`:`<span class="hint">Shows the full wide shot on a soft blurred background.</span>`}</div>`:`<div></div>`}
    <div class="field"><span class="lbl">On screen</span>
      <label class="check"><input type="checkbox" data-opt="subs" ${st.subs?"checked":""}><span>Subtitles</span></label>
      <label class="check"><input type="checkbox" data-opt="highlight" ${st.highlight?"checked":""}><span>Light up each word as it’s said</span></label>
      <label class="check"><input type="checkbox" data-opt="headline" ${st.headline?"checked":""}><span>Clip title at the top</span></label>
      <label class="check"><input type="checkbox" data-opt="logo" ${st.logo?"checked":""}><span>CPIC logo</span></label></div>
    <div class="field"><span class="lbl">Editing</span>
      <label class="check"><input type="checkbox" data-opt="cutSilence" ${st.cutSilence?"checked":""}><span>Cut out pauses and silences</span></label>
      <label class="check"><input type="checkbox" data-opt="punch" ${st.punch?"checked":""}><span>Gentle zoom at each cut, so jumps look smooth</span></label>
      <span class="hint">Every clip fades in and out.</span></div>
  </div>
  <div class="prevbox"><canvas id="lookPrev" aria-label="Preview of the clip look"></canvas></div></section>`;
}

/* ---------------- live bits ---------------- */
let prevT=null;
function drawLookPreview(){ clearTimeout(prevT); prevT=setTimeout(async()=>{
  const cv=$("lookPrev"); if(!cv||!S.vtrack) return; const F=FORMATS[S.style.format]; const k=360/F.h; const W=F.w, H=F.h;
  try{ await document.fonts.load("800 60px Montserrat"); const info=sinkFor(W,H); const t=Math.min(S.dur-0.5,($("vid")&&$("vid").currentTime)||S.dur*0.3);
    const wc=await info.sink.getCanvas(t); const big=document.createElement("canvas"); big.width=W; big.height=H; const ctx=big.getContext("2d");
    drawFrame(ctx,W,H,wc&&wc.canvas,info,1); const c=S.clips.find(x=>x.id===S.sel)||S.clips[0]||{title:"Know what you’re looking for",start:t,end:t+8,drop:[]};
    const fake=[{s:0,e:9,ws:"Where you are now is not where you should be".split(" ").slice(0,W<H?4:7).map((w,i)=>({w,s:i*0.4,e:i*0.4+0.4}))}];
    drawOverlay(ctx,W,H,c,0.5,10,fake,await wm());
    cv.width=Math.round(W*k); cv.height=Math.round(H*k); cv.getContext("2d").drawImage(big,0,0,cv.width,cv.height);
  }catch(e){ console.warn(e); } },120); }
let preview=null;
function startPreview(c){ const v=$("vid"); if(!v) return; S.sel=c.id;
  (async()=>{ let au=null; if(S.style.cutSilence){ toast("Finding the pauses…"); au=await decodeAudio(c.start-0.3,c.end+0.3); }
    const segs=keepSegments(c,au); if(!segs.length) return; preview={segs,i:0,clip:c,chunks:S.cues.length?subChunks(c,segs,99):null}; v.currentTime=segs[0].s; v.play(); toast(`Playing “${c.title}” as it will be cut`); })(); }
function tick(){
  const v=$("vid"); if(v){
    const t=v.currentTime; const ph=$("ph"); if(ph&&S.dur) ph.style.left=(t/S.dur*100)+"%";
    if(preview&&!v.paused){ const g=preview.segs[preview.i]; if(t>=g.e-0.02){ preview.i++; if(preview.i>=preview.segs.length){ v.pause(); preview=null; } else v.currentTime=preview.segs[preview.i].s; } }
    const so=$("subov"); if(so){ let txt=""; if(S.cues.length&&S.style.subs){ const c=S.cues.find(c=>t>=c.s&&t<c.e); txt=c?c.t:""; } so.textContent=txt; }
    if(S.tab==="transcript"&&S.cues.length&&Math.abs(t-S.now)>0.25){ S.now=t; const i=S.cues.findIndex(c=>t>=c.s&&t<c.e); const prev=document.querySelector(".cue.now"); const el=i>=0&&document.querySelector(`[data-cue="${i}"]`);
      if(prev&&prev!==el) prev.classList.remove("now"); if(el&&!el.classList.contains("now")){ el.classList.add("now"); if(!v.paused){ const tx=$("tx"); if(tx){ const r=el.offsetTop-tx.offsetTop-tx.clientHeight/3; tx.scrollTop=r; } } } }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function afterRender(){ if(S.ready) drawLookPreview(); }
function renderClips(){ const p=$("sidePane"); if(p&&S.tab==="clips"){ const sc=p.scrollTop; p.innerHTML=viewClips(); p.scrollTop=sc; } else if(S.ready&&S.tab!=="clips"){ /* progress lives in the Clips tab */ } }
function saveStyle(){ lsSet("sc.style",JSON.stringify(S.style)); }
function addClip(a,b,title,extra={}){ if(!(b>a)) return null; const [s,e]=snap(a,b); const c=Object.assign({id:newId(),title:title||`Clip ${S.clips.length+1}`,start:s,end:e,drop:[],caption:""},extra); S.clips.push(c); S.clips.sort((x,y)=>x.start-y.start); S.sel=c.id; saveProj(); return c; }

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a,[data-cue]"); if(!t) return; const d=t.dataset;
  if(t.id==="toastAct"){ const f=toastFn; $("toast").hidden=true; toastFn=null; if(f) f(); return; }
  if(t.id==="usePaste"){ loadTranscriptText($("pasteTx").value,"Pasted transcript"); return; }
  if(t.id==="aiFind"){ S.find.open=!S.find.open; if(S.find.open&&S.find.scope!=="marks") S.find.scope="all"; render(); if(S.find.open) $("findPanel").scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
  if(t.id==="findClose"){ S.find.open=false; render(); return; }
  if(t.id==="findGo"){ lsSet("sc.count",S.find.count); lsSet("sc.len",S.find.len); findClips(); return; }
  if(d.scope){ S.find.scope=d.scope; render(); return; }
  if(d.count){ S.find.count=Number(d.count); render(); return; }
  if(d.len){ S.find.len=d.len; render(); return; }
  if(d.split){ S.find.open=true; S.find.scope=d.split; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.id==="openHist"){ S.page="history"; render(); window.scrollTo(0,0); refreshUsage(); return; }
  if(t.id==="closeHist"){ S.page="work"; render(); window.scrollTo(0,0); return; }
  if(d.hdl){ const m=S.history.made.find(x=>x.id===d.hdl); if(m) downloadMade(m,t); return; }
  if(d.hsrt){ const m=S.history.made.find(x=>x.id===d.hsrt); if(m&&S.dl) S.dl.save({filename:`cpic-${(m.title||"clip").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.srt`,data:m.srt}).catch(()=>{}); return; }
  if(d.hcap){ const m=S.history.made.find(x=>x.id===d.hcap); try{ await navigator.clipboard.writeText(m.caption); toast("Caption copied"); }catch(_){ toast("Couldn’t copy. Select the text instead."); } return; }
  if(d.hdel){ const m=S.history.made.find(x=>x.id===d.hdel); if(!m) return; if(S.armed==="h:"+m.id){ S.armed=null; deleteMade(m); } else { S.armed="h:"+m.id; render(); setTimeout(()=>{ if(S.armed==="h:"+m.id){ S.armed=null; render(); } },4000); } return; }
  if(t.id==="closeVid"){ const v=$("vid"); if(v) v.pause(); Object.assign(S,{ready:false,file:null}); render(); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.cue!==undefined){ const i=Number(d.cue), v=$("vid");
    if(e.shiftKey&&S.rngA!=null&&S.rngA!==i){ const a=Math.min(S.rngA,i), b=Math.max(S.rngA,i); const c=addClip(S.cues[a].s,S.cues[b].e,S.cues[a].t.split(" ").slice(0,6).join(" ")); S.rngA=null; S.tab="clips"; render(); if(c) toast(`Clip added · ${fmtLen(c.end-c.start)}`); return; }
    S.rngA=i; if(v){ v.currentTime=S.cues[i].s; } document.querySelectorAll(".cue.rng").forEach(x=>x.classList.remove("rng")); t.classList.add("rng"); return; }
  if(t.id==="mIn"||t.id==="mOut"){ const v=$("vid"); if(!v) return; S.mark[t.id==="mIn"?"in":"out"]=v.currentTime; render(); return; }
  if(t.id==="mAdd"){ const c=addClip(S.mark.in,S.mark.out); S.mark={in:null,out:null}; S.tab="clips";
    if(c&&c.end-c.start>=90){ S.find.open=true; S.find.scope=c.id; render(); window.scrollTo({top:0,behavior:"smooth"}); toast(`Added a ${fmtLen(c.end-c.start)} part. Choose how many clips to make from it.`); }
    else { render(); if(c) toast(`Clip added · ${fmtLen(c.end-c.start)}`); } return; }
  if(t.id==="tsAdd"){ let n=0; for(const line of $("tsIn").value.split("\n")){ const m=line.match(/(\d{1,2}:\d{2}(?::\d{2})?)\s*(?:-|–|—|to)\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*(.*)/i); if(!m) continue; const a=parseTime(m[1]), b=parseTime(m[2]); if(b>a&&b<=S.dur+1){ addClip(a,b,m[3].replace(/^[\s:–—-]+/,"").trim()||null); n++; } }
    if(n){ S.tab="clips"; render(); toast(`${n} clips added`); } else toast("No timestamps found. Write them like 12:30 - 14:05"); return; }
  if(t.id==="usePlan"){ const p=S.plans.find(x=>x.id===$("planSel").value); if(!p) return; let n=0; for(const c of p.clips||[]){ const a=typeof c.start==="number"?c.start:parseTime(c.start), b=typeof c.end==="number"?c.end:parseTime(c.end); if(b>a&&b<=S.dur+1){ addClip(a,b,c.title,{caption:c.caption||""}); n++; } }
    if(p.sermonId) S.sermonId=p.sermonId; if(p.youtubeUrl) S.ytLink=p.youtubeUrl; S.tab="clips"; saveProj(); render(); toast(n?`${n} clips added from “${p.title}”`:"Those timestamps don’t fit this video"); return; }
  if(d.preview){ const c=S.clips.find(x=>x.id===d.preview); if(c) startPreview(c); return; }
  if(d.nudge){ const [id,w,dv]=d.nudge.split(":"); const c=S.clips.find(x=>x.id===id); if(!c) return; if(w==="s") c.start=Math.max(0,Math.min(c.end-3,c.start+Number(dv))); else c.end=Math.min(S.dur,Math.max(c.start+3,c.end+Number(dv))); saveProj(); render(); return; }
  if(d.lines){ const c=S.clips.find(x=>x.id===d.lines); c.open=!c.open; S.sel=c.id; renderClips(); return; }
  if(d.cap){ const c=S.clips.find(x=>x.id===d.cap); if(c) writeCaption(c); return; }
  if(d.copy){ const c=S.clips.find(x=>x.id===d.copy); try{ await navigator.clipboard.writeText(c.caption); toast("Caption copied"); }catch(_){ toast("Select the caption and press Ctrl+C"); } return; }
  if(d.make){ const c=S.clips.find(x=>x.id===d.make); if(c) renderClip(c); return; }
  if(t.id==="makeAll"){ for(const c of S.clips) await renderClip(c); toast("All clips are ready"); return; }
  if(d.save||d.srt){ const c=S.clips.find(x=>x.id===(d.save||d.srt)); if(!S.dl){ toast("Downloads aren’t available in this view."); return; }
    const slug=(c.title||"clip").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"clip";
    try{ await S.dl.save(d.save?{filename:`cpic-${slug}.mp4`,data:c.blob}:{filename:`cpic-${slug}.srt`,data:c.srt}); }catch(err){ if(err&&err.code!=="declined") toast("The file couldn’t be saved."); } return; }
  if(d.del){ const i=S.clips.findIndex(x=>x.id===d.del); const [c]=S.clips.splice(i,1); saveProj(); render(); toast(`“${c.title}” removed`,"Undo",()=>{ S.clips.splice(i,0,c); saveProj(); render(); }); return; }
  if(d.fmt){ S.style.format=d.fmt; saveStyle(); render(); return; }
  if(d.fit){ S.style.fit=d.fit; saveStyle(); render(); return; }
});
const tlSeek=e=>{ const tl=$("tl"), v=$("vid"); if(!tl||!v) return; const r=tl.getBoundingClientRect(); v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*S.dur; };
document.addEventListener("pointerdown",e=>{ if(e.target.closest("#tl")){ preview=null; tlSeek(e); const mv=ev=>tlSeek(ev), up=()=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); }; document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up); } });
document.addEventListener("input",e=>{ const t=e.target, d=t.dataset;
  if(t.id==="txQ"){ S.q=t.value; const p=$("sidePane"); clearTimeout(S._q); S._q=setTimeout(()=>{ p.innerHTML=viewTx(); const q=$("txQ"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); },200); }
  if(d.title){ const c=S.clips.find(x=>x.id===d.title); c.title=t.value; saveProj(); }
  if(d.captxt){ const c=S.clips.find(x=>x.id===d.captxt); c.caption=t.value; saveProj(); syncCaption(c); }
  if(t.id==="cropX"){ S.style.cropX=Number(t.value); saveStyle(); drawLookPreview(); }
  if(t.id==="setYt"){ S.ytLink=t.value.trim(); }
  if(t.id==="countIn"){ const v=parseInt(t.value,10); if(v>0){ S.find.count=Math.min(20,v); document.querySelectorAll("[data-count]").forEach(b=>b.setAttribute("aria-pressed","false")); const g=$("findGo"); if(g) g.textContent=`${S.cues.length?"Make":"Split into"} ${S.find.count} clips`; } }
  if(t.id==="minIn"){ S.find.min=t.value; } if(t.id==="maxIn"){ S.find.max=t.value; }
});
document.addEventListener("change",e=>{ const t=e.target, d=t.dataset;
  if(t.id==="vidIn"){ const f=t.files&&t.files[0]; t.value=""; if(f) loadVideo(f); }
  if(t.id==="txIn"){ const f=t.files&&t.files[0]; t.value=""; if(f) f.text().then(x=>loadTranscriptText(x,f.name)); }
  if(t.id==="setSermon"){ S.sermonId=t.value; saveProj(); }
  if(d.opt){ S.style[d.opt]=t.checked; saveStyle(); drawLookPreview(); }
  if(d.keep){ const [id,i]=d.keep.split(":"); const c=S.clips.find(x=>x.id===id); const n=Number(i); c.drop=(c.drop||[]).filter(x=>x!==n); if(!t.checked) c.drop.push(n); t.closest("label").classList.toggle("off",!t.checked); saveProj(); }
});
document.addEventListener("keydown",e=>{ if(!S.ready||/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName)) return; const v=$("vid"); if(!v) return;
  if(e.key==="i"||e.key==="I"){ S.mark.in=v.currentTime; render(); } else if(e.key==="o"||e.key==="O"){ S.mark.out=v.currentTime; render(); } else if(e.key===" "&&e.target===document.body){ e.preventDefault(); v.paused?v.play():v.pause(); } });
document.addEventListener("dragover",e=>{ e.preventDefault(); const z=e.target.closest&&e.target.closest(".drop"); document.querySelectorAll(".drop").forEach(x=>x.classList.toggle("over",x===z)); });
document.addEventListener("drop",e=>{ e.preventDefault(); document.querySelectorAll(".drop").forEach(x=>x.classList.remove("over")); const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];
  for(const f of fs){ if(/\.(srt|vtt|sbv|txt)$/i.test(f.name)) f.text().then(x=>loadTranscriptText(x,f.name)); else if(/^video\//.test(f.type)||/\.(mp4|mov|webm|mkv)$/i.test(f.name)) loadVideo(f); } });

/* ---------------- boot ---------------- */
render();
(async()=>{ if(!(window.claude&&claude.use)) return;
  const [db,user,sample,dl,assets]=await Promise.all(["db","user","sample","downloads","assets"].map(n=>claude.use(n).catch(()=>null)));
  S.db=db; S.sample=sample; S.dl=dl; S.assets=assets; S.isEditor=!!(user&&await user.canEdit().catch(()=>false));
  if(db){ db.collection("plans").limit(200).onSnapshot(q=>{ S.plans=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))); if(S.ready&&!document.activeElement.closest("#sidePane")) render(); },()=>{});
    const hist=()=>{ if(S.page==="history"||!S.ready) render(); else { const b=$("openHist"); if(b) b.textContent=`History (${S.history.made.length})`; } };
    db.collection("videos").limit(1000).onSnapshot(q=>{ S.history.videos=q.docs.map(d=>Object.assign({id:d.id},d.data())); hist(); },()=>{});
    db.collection("made").limit(1000).onSnapshot(q=>{ S.history.made=q.docs.map(d=>Object.assign({id:d.id},d.data())); hist(); },()=>{});
    db.collection("sermons").limit(500).onSnapshot(q=>{ if(!q.size) return; const m=new Map(S.lib.sermons.map(x=>[x.id,x])); q.docs.forEach(d=>m.set(d.id,Object.assign({id:d.id},d.data()))); S.lib.sermons=[...m.values()]; },()=>{}); }
  render();
})();
window.__S=S;
</script>
